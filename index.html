<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通用多语言汉字多义项与多音字语音字帖系统</title>
  <!-- 引入汉字笔顺库与拼音库 -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.3/dist/index.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
    }

    /* 顶部控制栏 */
    .controls {
      background: #fff;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 1040px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .controls input {
      flex: 3;
      min-width: 280px;
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
    }
    .controls select {
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      background: #fff;
    }
    .btn {
      padding: 9px 18px;
      font-size: 15px;
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-print { background: #52c41a; }
    .btn:hover { opacity: 0.9; }

    /* A4 打印纸张排版 */
    .sheet-page {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 12mm 15mm;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    /* 词组/短语/句子卡片 */
    .word-block {
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 2px dashed #eaeaea;
    }

    /* 词条头部：拼音 + 发音提示 + 目标语言多义项翻译 */
    .word-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      background: #f8fafc;
      padding: 8px 14px;
      border-radius: 6px;
      border-left: 4px solid #1890ff;
    }
    .word-text {
      font-size: 19px;
      font-weight: bold;
      color: #1e293b;
    }
    .word-pinyin {
      font-size: 15px;
      color: #1890ff;
      font-weight: bold;
    }
    .btn-audio {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      color: #096dd9;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .btn-audio:hover {
      background: #bae7ff;
    }
    .word-trans {
      font-size: 13.5px;
      color: #334155;
      background: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px dashed #cbd5e1;
      cursor: text;
      flex: 1;
      line-height: 1.4;
    }
    .word-trans:focus {
      outline: 1px solid #1890ff;
      background: #f0fdf4;
    }

    /* 单字知识卡片 */
    .char-card {
      margin-bottom: 14px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
    }

    /* 第一行：配图 + 字源演变(甲金篆楷) + 多重语法释义 */
    .char-info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 6px;
      padding: 8px 10px;
    }

    /* 具象/象形插图 */
    .pic-badge {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .pic-badge svg {
      width: 44px;
      height: 44px;
    }

    /* 汉字演变轨迹 */
    .etymology-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border-right: 1px solid #e2e8f0;
      border-left: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .evo-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 32px;
    }
    .evo-glyph {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .evo-glyph-text {
      font-size: 15px;
      font-family: "KaiTi", "STKaiti", serif;
      color: #334155;
    }
    .evo-label {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
      transform: scale(0.9);
    }
    .evo-arrow {
      color: #cbd5e1;
      font-size: 11px;
    }

    /* 语法与词性结构区 */
    .grammar-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .grammar-header-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hsk-badge {
      background: #ff4d4f;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .pos-badge {
      background: #8b5cf6;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 3px;
    }
    .grammar-pattern-tag {
      background: #e0f2fe;
      color: #0369a1;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: bold;
    }
    .grammar-meaning-target {
      font-size: 11.5px;
      color: #334155;
      line-height: 1.35;
    }

    /* 第二行：单字读音 + 笔顺 + 米字格描红 */
    .char-practice-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .char-badge {
      width: 60px;
      text-align: center;
      font-size: 14px;
      color: #1e293b;
      font-weight: bold;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .char-pinyin-small {
      color: #1890ff;
      font-size: 13px;
    }
    .btn-action-group {
      display: flex;
      gap: 3px;
    }
    .btn-small-audio {
      padding: 2px 4px;
      font-size: 10px;
      background: #52c41a;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-animate {
      padding: 2px 4px;
      font-size: 10px;
      background: #fa8c16;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    /* 米字格布局 */
    .grid-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mi-grid {
      width: 42px;
      height: 42px;
      border: 1px solid #ff4d4f;
      position: relative;
      background:
        linear-gradient(to top right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px));
      background-size: 100% 100%;
    }

    /* 打印适配 */
    @media print {
      body { background: transparent; padding: 0; }
      .controls { display: none !important; }
      .sheet-page { box-shadow: none; width: 100%; margin: 0; padding: 0; }
      .btn-animate, .btn-audio, .btn-small-audio { display: none !important; }
      .word-trans { border: none; background: transparent; padding: 0; }
      .char-info-row { background: #fff !important; border: 1px solid #cbd5e1; }
      .char-card { border: 1px solid #94a3b8; }
    }
  </style>
</head>
<body>

  <!-- 控制工具栏 -->
  <div class="controls">
    <input type="text" id="textInput" value="太大了, 中国银行, 去看电影, 觉得, 快乐" placeholder="输入任意词语或句子（自动解析多重常用释义与多音字）..." />
    
    <select id="langSelect" onchange="generateSheet()">
      <option value="de">🇩🇪 德语 (Deutsch)</option>
      <option value="en">🇬🇧 英语 (English)</option>
      <option value="es">🇪🇸 西班牙语 (Español)</option>
      <option value="fr">🇫🇷 法语 (Français)</option>
      <option value="it">🇮🇹 意大利语 (Italiano)</option>
      <option value="pt">🇵🇹 葡萄牙语 (Português)</option>
      <option value="ru">🇷🇺 俄语 (Русский)</option>
      <option value="none">🚫 无翻译</option>
    </select>

    <button class="btn" onclick="generateSheet()">生成字帖</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 打印字帖</button>
  </div>

  <div class="sheet-page" id="sheetContainer"></div>

  <script>
    const { pinyin } = pinyinPro;

    // 1. 各语种词性国际标准对照表
    const POS_I18N = {
      noun: { de: 'Nomen (名词)', en: 'Noun (名词)', es: 'Sustantivo (名词)', fr: 'Nom (名词)', it: 'Sostantivo (名词)', pt: 'Substantivo (名词)', ru: 'Существительное (名词)' },
      verb: { de: 'Verb (动词)', en: 'Verb (动词)', es: 'Verbo (动词)', fr: 'Verbe (动词)', it: 'Verbo (动词)', pt: 'Verbo (动词)', ru: 'Глагол (动词)' },
      adj:  { de: 'Adjektiv (形容词)', en: 'Adjective (形容词)', es: 'Adjetivo (形容词)', fr: 'Adjectif (形容词)', it: 'Aggettivo (形容词)', pt: 'Adjetivo (形容词)', ru: 'Прилагательное (形容词)' },
      adv:  { de: 'Adverb (副词)', en: 'Adverb (副词)', es: 'Adverbio (副词)', fr: 'Adverbe (副词)', it: 'Avverbio (副词)', pt: 'Advérbio (副词)', ru: 'Наречие (副词)' },
      pron: { de: 'Pronomen (代词)', en: 'Pronoun (代词)', es: 'Pronombre (代词)', fr: 'Pronom (代词)', it: 'Pronome (代词)', pt: 'Pronome (代词)', ru: 'Местоимение (代词)' },
      num:  { de: 'Zahlwort (数词/量词)', en: 'Numeral/Measure Word', es: 'Numeral / Clasificador', fr: 'Numéral / Classificateur', it: 'Numerale / Classificatore', pt: 'Numeral / Classificador', ru: 'Числительное / Счетное сл.' },
      prep: { de: 'Präposition (介词)', en: 'Preposition (介词)', es: 'Preposición (介词)', fr: 'Préposition (介词)', it: 'Preposizione (介词)', pt: 'Preposizione (介词)', ru: 'Предлог (介词)' }
    };

    // 2. 常用高频词多义项地道词典（支持多种常见表达）
    const RICH_DICT = {
      '太大了': {
        de: '1. viel zu groß / übermäßig groß  2. übergroß',
        en: '1. too big / extremely large  2. oversized',
        es: '1. demasiado grande / excesivamente grande  2. enorme',
        fr: '1. trop grand / excessivement grand  2. surdimensionné',
        it: '1. troppo grande / eccessivamente grande  2. enorme',
        pt: '1. grande demais / excessivamente grande  2. desmedido',
        ru: '1. слишком большой  2. чересчур крупный'
      },
      '中国银行': {
        de: '1. Bank of China  2. Chinesische Zentral-/Handelsbank',
        en: '1. Bank of China (BOC)',
        es: '1. Banco de China (Bank of China)',
        fr: '1. Banque de Chine (Bank of China)',
        it: '1. Banca di Cina (Bank of China)',
        pt: '1. Banco da China (Bank of China)',
        ru: '1. Банк Китая (Bank of China)'
      },
      '看电影': {
        de: '1. ins Kino gehen  2. einen Film ansehen / schauen',
        en: '1. watch a movie  2. go to the cinema',
        es: '1. ver una película  2. ir al cine',
        fr: '1. regarder un film  2. aller au cinéma',
        it: '1. guardare un film  2. andare al cinema',
        pt: '1. ver um filme  2. ir ao cinema',
        ru: '1. смотреть фильм  2. ходить в кино'
      },
      '觉得': {
        de: '1. finden / meinen / glauben  2. sich fühlen (spüren)',
        en: '1. feel / think  2. perceive / believe',
        es: '1. sentir / creer  2. parecer / opinar',
        fr: '1. penser / trouver  2. ressentir / avoir l’impression',
        it: '1. pensare / ritenere  2. sentirsi',
        pt: '1. achar / pensar  2. sentir-se',
        ru: '1. считать / думать  2. чувствовать'
      },
      '快乐': {
        de: '1. glücklich / fröhlich  2. heiter / erfreut',
        en: '1. happy / joyful  2. cheerful / delighted',
        es: '1. feliz / alegre  2. contento',
        fr: '1. heureux / joyeux  2. gai / content',
        it: '1. felice / allegro  2. gioioso',
        pt: '1. feliz / alegre  2. contente',
        ru: '1. счастливый / радостный  2. весёлый'
      },
      '太': {
        de: '1. zu / allzu (Grad)  2. äußerst / höchst (sehr)  3. ältester (Verwandtschaft)',
        en: '1. too / overly (degree)  2. extremely / utmost  3. highest/greatest',
        es: '1. demasiado (grado)  2. sumamente / extremadamente  3. supremo',
        fr: '1. trop (degré)  2. extrêmement / très  3. le plus ancien/haut',
        it: '1. troppo (grado)  2. estremamente / assai  3. supremo',
        pt: '1. demais (grau)  2. extremamente / sumamente  3. supremo',
        ru: '1. слишком / чересчур  2. чрезвычайно / крайне  3. наивысший'
      },
      '大': {
        de: '1. groß / riesig (Umfang)  2. alt (Alter)  3. bedeutend / wichtig',
        en: '1. big / large  2. old (age)  3. major / greatly',
        es: '1. grande / amplio  2. mayor (edad)  3. importante / grave',
        fr: '1. grand / large  2. âgé  3. important / majeur',
        it: '1. grande / vasto  2. anziano (età)  3. importante',
        pt: '1. grande / amplo  2. velho (idade)  3. principal',
        ru: '1. большой / крупный  2. взрослый (возраст)  3. важный / великий'
      },
      '行': {
        de: '1. gehen / reisen (xíng)  2. in Ordnung / fähig (xíng)  3. Bank / Branche / Reihe (háng)',
        en: '1. walk / travel (xíng)  2. OK / capable (xíng)  3. bank / profession / line (háng)',
        es: '1. andar / viajar (xíng)  2. estar bien / capaz (xíng)  3. banco / fila / sector (háng)',
        fr: '1. marcher / voyager (xíng)  2. d’accord / capable (xíng)  3. banque / ligne / métier (háng)',
        it: '1. camminare (xíng)  2. va bene (xíng)  3. banca / fila / mestiere (háng)',
        pt: '1. andar / viajar (xíng)  2. tudo bem / capaz (xíng)  3. banco / profissão / fila (háng)',
        ru: '1. идти / ходить (xíng)  2. сойдёт / ладно (xíng)  3. банк / ряд / профессия (háng)'
      }
    };

    // 3. 基于语境的多音字提取
    function getContextualPinyinList(phrase) {
      return pinyin(phrase, { toneType: 'symbol', type: 'array' });
    }

    // 4. Web Speech API 原生语音朗读
    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        alert('当前浏览器暂不支持语音合成朗读功能');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.85;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // 5. 动态多义项翻译与聚合网关
    async function getRichMultiTranslation(text, targetLang) {
      if (targetLang === 'none' || !text) return '';

      // 1. 优先从精校多义项词库中获取
      if (RICH_DICT[text] && RICH_DICT[text][targetLang]) {
        return RICH_DICT[text][targetLang];
      }

      // 2. 联机调用并聚合多重释义 (MyMemory 包含 matches 候选项)
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh-CN|${targetLang}`;
        const res = await fetch(url);
        const data = await res.json();
        
        const candidateSet = new Set();
        if (data?.responseData?.translatedText) {
          const mainTrans = data.responseData.translatedText.trim();
          if (!mainTrans.startsWith('MYMEMORY WARNING') && !mainTrans.includes('QUERY LENGTH LIMIT')) {
            candidateSet.add(mainTrans.toLowerCase());
          }
        }
        
        // 抓取近义词/其它匹配选项
        if (Array.isArray(data?.matches)) {
          data.matches.forEach(m => {
            if (m.translation && m.quality > 40) {
              const clean = m.translation.trim().toLowerCase();
              if (!clean.includes('http') && clean !== text.toLowerCase() && clean.length < 40) {
                candidateSet.add(clean);
              }
            }
          });
        }

        const candidates = Array.from(candidateSet).slice(0, 3);
        if (candidates.length > 0) {
          return candidates.map((c, i) => `${i + 1}. ${c}`).join('  ');
        }
      } catch (e) {
        console.warn('MyMemory 调度异常:', e);
      }

      // 3. 降级备用接口
      try {
        const lingvaUrl = `https://lingva.ml/api/v1/zh/${targetLang}/${encodeURIComponent(text)}`;
        const res2 = await fetch(lingvaUrl);
        const data2 = await res2.json();
        if (data2?.translation) {
          return `1. ${data2.translation.trim()}`;
        }
      } catch (e2) {
        console.warn('Lingva 调度异常:', e2);
      }

      return '点击补充多重常用释义';
    }

    // 6. 动态语法与词性分析
    function inferGrammarAndPOS(char, targetLang) {
      const code = char.charCodeAt(0);
      let posKey = 'noun';
      let patternZh = `${char} + 名词 / 结构`;
      let hsk = 'HSK 1';

      if ('太很非常真最更挺特别极其'.includes(char)) {
        posKey = 'adv';
        patternZh = `${char} + 形容词 / 动词 + (了)`;
        hsk = 'HSK 1';
      } else if ('看吃喝走去来想爱做买写听读说说见找问笑学住工作睡觉行觉'.includes(char)) {
        posKey = 'verb';
        patternZh = `${char} + 宾语 (Objekt) / 补语`;
        hsk = 'HSK 1';
      } else if ('大小高低好坏多少红黑白长短早晚美快慢乐'.includes(char)) {
        posKey = 'adj';
        patternZh = `很 / 太 + ${char} (作谓语/修饰语)`;
        hsk = 'HSK 1';
      } else if ('你我他她它这那谁什么哪'.includes(char)) {
        posKey = 'pron';
        patternZh = `${char} + (的) + 名词`;
        hsk = 'HSK 1';
      } else if ('在从向对比被把跟给'.includes(char)) {
        posKey = 'prep';
        patternZh = `${char} + 地点 / 对象 + 动词`;
        hsk = 'HSK 2';
      } else if ('一二三四五六七八九十百千万个张本支只条位块'.includes(char)) {
        posKey = 'num';
        patternZh = `数词 + ${char} + 名词`;
        hsk = 'HSK 1';
      } else {
        posKey = 'noun';
        patternZh = `(这/那) + 量词 + ${char}`;
        hsk = code % 2 === 0 ? 'HSK 2' : 'HSK 3';
      }

      const posName = POS_I18N[posKey][targetLang] || POS_I18N[posKey]['en'];
      return { posKey, posName, patternZh, hsk };
    }

    function getEtymologyNodes(char) {
      return [
        { name: '甲骨', content: char },
        { name: '金文', content: char },
        { name: '小篆', content: char },
        { name: '楷书', content: char }
      ];
    }

    function generateDynamicIcon(char) {
      const colors = ['#1890ff', '#52c41a', '#fa8c16', '#eb2f96', '#722ed1', '#13c2c2', '#faad14'];
      const color = colors[char.charCodeAt(0) % colors.length];
      return `
        <svg viewBox="0 0 64 64">
          <rect x="6" y="6" width="52" height="52" rx="10" fill="${color}" fill-opacity="0.12"/>
          <text x="32" y="40" font-size="26" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="${color}" text-anchor="middle">${char}</text>
        </svg>
      `;
    }

    // 7. 生成字帖核心入口
    async function generateSheet() {
      const container = document.getElementById('sheetContainer');
      const text = document.getElementById('textInput').value.trim();
      const targetLang = document.getElementById('langSelect').value;
      container.innerHTML = '';

      const phrases = text.split(/[,，;；\n\s]+/).filter(item => item.trim().length > 0);
      if (phrases.length === 0) {
        alert('请输入有效的中文词语或句子！');
        return;
      }

      let globalGridIdx = 0;

      for (let pIdx = 0; pIdx < phrases.length; pIdx++) {
        const rawPhrase = phrases[pIdx];
        const chars = (rawPhrase.match(/[\u4e00-\u9fa5]/g) || []).join('');
        if (!chars) continue;

        // 提取整句多音字语境下的拼音列表
        const contextualPinyins = getContextualPinyinList(chars);
        const phrasePinyinStr = contextualPinyins.join(' ');
        const transBoxId = `trans-box-${pIdx}`;

        const wordBlock = document.createElement('div');
        wordBlock.className = 'word-block';

        // 词条顶部头部 + 语音朗读 + 多义项翻译展示区
        wordBlock.innerHTML = `
          <div class="word-header">
            <span class="word-text">${chars}</span>
            <span class="word-pinyin">[ ${phrasePinyinStr} ]</span>
            <button class="btn-audio" onclick="speakText('${chars}')">🔊 朗读词句</button>
            <div class="word-trans" id="${transBoxId}" contenteditable="true" title="点击可直接编辑修改多重释义">${targetLang === 'none' ? '' : '多义项解析中...'}</div>
          </div>
        `;

        // 逐字生成字卡
        for (let cIdx = 0; cIdx < chars.length; cIdx++) {
          const char = chars[cIdx];
          const charPy = contextualPinyins[cIdx] || pinyin(char, { toneType: 'symbol' });
          const firstGridId = `grid-demo-${globalGridIdx}`;
          const grammarMeaningId = `grammar-mean-${pIdx}-${cIdx}`;

          const grammarInfo = inferGrammarAndPOS(char, targetLang);
          const evoNodes = getEtymologyNodes(char);
          const iconSvg = generateDynamicIcon(char);

          const evoHtml = evoNodes.map((node, idx) => `
            <div class="evo-node">
              <div class="evo-glyph">
                <span class="evo-glyph-text">${node.content}</span>
              </div>
              <div class="evo-label">${node.name}</div>
            </div>
            ${idx < evoNodes.length - 1 ? '<span class="evo-arrow">→</span>' : ''}
          `).join('');

          const card = document.createElement('div');
          card.className = 'char-card';

          card.innerHTML = `
            <div class="char-info-row">
              <div class="pic-badge" title="${char} 的字图解">${iconSvg}</div>
              <div class="etymology-box" title="汉字源流演变">${evoHtml}</div>
              <div class="grammar-box">
                <div class="grammar-header-line">
                  <span class="hsk-badge">${grammarInfo.hsk}</span>
                  <span class="pos-badge">${grammarInfo.posName}</span>
                  <span class="grammar-pattern-tag">${grammarInfo.patternZh}</span>
                </div>
                <div class="grammar-meaning-target" id="${grammarMeaningId}" contenteditable="true" title="点击可编辑">常用义项加载中...</div>
              </div>
            </div>
          `;

          // 笔顺演示与米字格
          const practiceRow = document.createElement('div');
          practiceRow.className = 'char-practice-row';

          const charBadge = document.createElement('div');
          charBadge.className = 'char-badge';
          charBadge.innerHTML = `
            <div class="char-pinyin-small">${charPy}</div>
            <div class="btn-action-group">
              <button class="btn-small-audio" onclick="speakText('${char}')" title="朗读该字">🔊</button>
              <button class="btn-animate" onclick="playStroke('${firstGridId}', '${char}')" title="播放笔顺">▶ 笔顺</button>
            </div>
          `;
          practiceRow.appendChild(charBadge);

          // 米字格（1示范 + 2描红 + 4练习）
          const gridList = document.createElement('div');
          gridList.className = 'grid-list';
          
          const totalGrids = 7;
          const currentGrids = [];
          for (let g = 0; g < totalGrids; g++) {
            const grid = document.createElement('div');
            grid.className = 'mi-grid';
            grid.id = (g === 0) ? firstGridId : `grid-${globalGridIdx}-${g}`;
            gridList.appendChild(grid);
            currentGrids.push(grid.id);
          }
          practiceRow.appendChild(gridList);
          card.appendChild(practiceRow);

          wordBlock.appendChild(card);
          container.appendChild(wordBlock);

          // 渲染黑字示范
          HanziWriter.create(firstGridId, char, {
            width: 42, height: 42, padding: 3, strokeColor: '#000000', showOutline: false
          });

          // 渲染描红浅灰字
          for (let g = 1; g <= 2; g++) {
            HanziWriter.create(currentGrids[g], char, {
              width: 42, height: 42, padding: 3, strokeColor: '#d4d4d4', showOutline: false
            });
          }

          // 异步加载单字多义项
          if (targetLang !== 'none') {
            getRichMultiTranslation(char, targetLang).then(res => {
              const el = document.getElementById(grammarMeaningId);
              if (el) el.innerText = `常用释义: ${res}`;
            });
          }

          globalGridIdx++;
        }

        // 异步加载整词/短语多重常用翻译
        if (targetLang !== 'none') {
          getRichMultiTranslation(chars, targetLang).then(res => {
            const transEl = document.getElementById(transBoxId);
            if (transEl) transEl.innerText = res;
          });
        }
      }
    }

    // 播放单字笔顺动画
    function playStroke(elementId, char) {
      const targetElem = document.getElementById(elementId);
      targetElem.innerHTML = '';
      const writer = HanziWriter.create(elementId, char, {
        width: 42, height: 42, padding: 3,
        strokeColor: '#1890ff',
        strokeAnimationSpeed: 1.2,
        delayBetweenStrokes: 120
      });
      writer.animateCharacter();
    }

    window.onload = generateSheet;
  </script>
</body>
</html>
