<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多语言汉字笔顺描红字帖</title>
  <!-- 引入汉字笔顺库与拼音库 -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.3/dist/index.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
    }

    /* 顶部控制栏 */
    .controls {
      background: #fff;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 860px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .controls input {
      flex: 2;
      min-width: 200px;
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
    }
    .controls select {
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      background: #fff;
    }
    .btn {
      padding: 8px 18px;
      font-size: 15px;
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-print { background: #52c41a; }
    .btn:hover { opacity: 0.9; }

    /* 字帖 A4 纸张排版 */
    .sheet-page {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 15mm;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    /* 单行生字 */
    .char-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px dashed #e8e8e8;
      padding-bottom: 8px;
    }

    /* 左侧汉字拼音与释义区 */
    .char-meta {
      width: 100px;
      text-align: center;
      margin-right: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .char-pinyin {
      font-size: 15px;
      color: #1890ff;
      font-weight: bold;
    }
    .char-trans {
      font-size: 12px;
      color: #4a5568;
      margin: 2px 0 4px;
      max-width: 95px;
      word-break: break-word;
      line-height: 1.2;
      border-bottom: 1px dotted #bbb;
      cursor: text;
    }
    .char-trans:focus {
      outline: 1px solid #1890ff;
      background: #e6f7ff;
    }
    .btn-animate {
      padding: 2px 6px;
      font-size: 11px;
      background: #fa8c16;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    /* 米字格布局 */
    .grid-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .mi-grid {
      width: 58px;
      height: 58px;
      border: 1px solid #ff4d4f;
      position: relative;
      background:
        linear-gradient(to top right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px));
      background-size: 100% 100%;
    }

    /* 打印适配 */
    @media print {
      body { background: transparent; padding: 0; }
      .controls { display: none !important; }
      .sheet-page { box-shadow: none; width: 100%; margin: 0; padding: 0; }
      .btn-animate { display: none; }
      .char-trans { border-bottom: none; }
    }
  </style>
</head>
<body>

  <!-- 控制工具栏 -->
  <div class="controls">
    <input type="text" id="textInput" value="日月山水木林" placeholder="输入生字..." />
    
    <!-- 语言选择 -->
    <select id="langSelect">
      <option value="de">🇩🇪 德语 (Deutsch)</option>
      <option value="en">🇬🇧 英语 (English)</option>
      <option value="fr">🇫🇷 法语 (Français)</option>
      <option value="es">🇪🇸 西班牙语 (Español)</option>
      <option value="none">🚫 无翻译</option>
    </select>

    <button class="btn" onclick="generateSheet()">生成字帖</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 打印字帖</button>
  </div>

  <div class="sheet-page" id="sheetContainer"></div>

  <script>
    const { pinyin } = pinyinPro;

    // 免费、免跨域限制的翻译接口
    async function translateWord(text, targetLang) {
      if (targetLang === 'none') return '';
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh-CN|${targetLang}`;
        const response = await fetch(url);
        const data = await response.json();
        if (data && data.responseData && data.responseData.translatedText) {
          return data.responseData.translatedText.replace(/^[#\s]+/, '').toLowerCase();
        }
      } catch (err) {
        console.error('翻译获取失败:', err);
      }
      return '';
    }

    // 生成字帖核心函数
    async function generateSheet() {
      const container = document.getElementById('sheetContainer');
      const text = document.getElementById('textInput').value.trim();
      const targetLang = document.getElementById('langSelect').value;
      container.innerHTML = '';

      const chars = text.match(/[\u4e00-\u9fa5]/g) || [];
      if (chars.length === 0) {
        alert('请输入有效的中文汉字！');
        return;
      }

      for (let charIdx = 0; charIdx < chars.length; charIdx++) {
        const char = chars[charIdx];
        const row = document.createElement('div');
        row.className = 'char-row';

        const py = pinyin(char, { toneType: 'symbol' });
        const transBoxId = `trans-${charIdx}`;

        const metaBox = document.createElement('div');
        metaBox.className = 'char-meta';
        metaBox.innerHTML = `
          <div class="char-pinyin">${py}</div>
          <div class="char-trans" id="${transBoxId}" contenteditable="true" title="点击可直接编辑修改释义">${targetLang === 'none' ? '' : '...'}</div>
          <button class="btn-animate" onclick="playStroke('${charIdx}', '${char}')">▶ 演示</button>
        `;
        row.appendChild(metaBox);

        // 生成米字格
        const gridList = document.createElement('div');
        gridList.className = 'grid-list';
        for (let i = 0; i < 7; i++) {
          const grid = document.createElement('div');
          grid.className = 'mi-grid';
          grid.id = `char-${charIdx}-grid-${i}`;
          gridList.appendChild(grid);
        }
        row.appendChild(gridList);
        container.appendChild(row);

        // 渲染示范字与描红字
        HanziWriter.create(`char-${charIdx}-grid-0`, char, {
          width: 58, height: 58, padding: 5, strokeColor: '#000000', showOutline: false
        });
        for (let i = 1; i <= 2; i++) {
          HanziWriter.create(`char-${charIdx}-grid-${i}`, char, {
            width: 58, height: 58, padding: 5, strokeColor: '#d9d9d9', showOutline: false
          });
        }

        // 异步填充多语言翻译
        if (targetLang !== 'none') {
          translateWord(char, targetLang).then(res => {
            const el = document.getElementById(transBoxId);
            if (el) el.innerText = res || '';
          });
        }
      }
    }

    // 播放笔顺动画
    function playStroke(charIdx, char) {
      const targetElem = document.getElementById(`char-${charIdx}-grid-0`);
      targetElem.innerHTML = '';
      const writer = HanziWriter.create(targetElem.id, char, {
        width: 58, height: 58, padding: 5,
        strokeColor: '#1890ff',
        strokeAnimationSpeed: 1.2,
        delayBetweenStrokes: 150
      });
      writer.animateCharacter();
    }

    window.onload = generateSheet;
  </script>
</body>
</html>
