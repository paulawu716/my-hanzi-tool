      border-radius: 8px;

      border: 1px solid #d9d9d9;
      border-radius: 4px;

      background: #fff;

      padding: 12mm 14mm;

      align-items: center;

      background: #f8fafc;

      border-radius: 6px;

  <script>
    const { pinyin } = pinyinPro;

    // 1. 各语言对应 TTS 语音合成代码映射
    const LANG_TTS_MAP = {
      de: 'de-DE',
      en: 'en-US',
      es: 'es-ES',
      fr: 'fr-FR',
      it: 'it-IT',
      pt: 'pt-PT',
      ru: 'ru-RU'
    };

    let cachedVoices = [];
    function loadVoices() {
      if ('speechSynthesis' in window) {
        cachedVoices = window.speechSynthesis.getVoices();
      }
    }
    loadVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 2. 全量通用德语正字法大写引擎（针对任意输入的德语翻译进行名词首字母大写处理）
    function universalGermanCapitalize(rawText, originalChinese = '') {
      if (!rawText) return '';

      // 德语小写虚词库（冠词、介词、连词、常见小写副词）
      const germanArticles = new Set([
        'der', 'die', 'das', 'den', 'dem', 'des', 'ein', 'eine', 'einen', 'einem', 'einer', 'eines'
      ]);
      const germanPrepositions = new Set([
        'in', 'ins', 'im', 'an', 'am', 'ans', 'auf', 'aufs', 'aus', 'bei', 'beim', 'mit', 'nach', 'von', 'vom', 'zu', 'zum', 'zur', 'für', 'fürs', 'um', 'ums', 'über', 'unter', 'vor', 'hinter', 'neben', 'zwischen', 'durch'
      ]);
      const germanConjunctions = new Set([
        'und', 'oder', 'aber', 'denn', 'doch', 'als', 'wie'
      ]);

      // 德语常见名词性后缀（出现则必然为名词，必须首字母大写）
      const nounSuffixes = [
        'ung', 'heit', 'keit', 'schaft', 'tion', 'sion', 'tät', 'tum', 'ment', 'chen', 'lein', 'ling', 'nis', 'ant', 'ent', 'ist', 'or', 'eur', 'enz', 'anz'
      ];

      // 对斜杠或分号分隔的每个释义分支独立处理
      const entries = rawText.split(/([\/;])/);

      return entries.map(part => {
        if (part === '/' || part === ';') return part;

        let str = part.trim();
        if (!str) return '';

        // 分割词汇与标点
        const tokens = str.split(/\s+/);
        const len = tokens.length;

        const capitalizedTokens = tokens.map((tok, idx) => {
          // 清理可能附带的标点
          const clean = tok.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
          const lower = clean.toLowerCase();

          if (!clean) return tok;

          // 规则 1：如果是冠词、介词、连词，保持小写（除非是整句首词）
          if (germanArticles.has(lower) || germanPrepositions.has(lower) || germanConjunctions.has(lower)) {
            return tok.toLowerCase();
          }

          // 规则 2：前一个词是冠词/介词/所有格（如 der ..., ein ..., ins ...），后面的实词为名词，必须大写
          if (idx > 0) {
            const prev = tokens[idx - 1].toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
            if (germanArticles.has(prev) || germanPrepositions.has(prev)) {
              return tok.charAt(0).toUpperCase() + tok.slice(1);
            }
          }

          // 规则 3：命中名词典型后缀（如 -ung, -heit 等），强制首字母大写
          const hasNounSuffix = nounSuffixes.some(suf => lower.length > suf.length + 2 && lower.endsWith(suf));
          if (hasNounSuffix) {
            return tok.charAt(0).toUpperCase() + tok.slice(1);
          }

          // 规则 4：短语末尾词且非动词不定式（以 en/eln 结尾的常见动词除外），通常为德语核心名词
          if (idx === len - 1 && len <= 3 && !lower.endsWith('en') && !lower.endsWith('ern') && !lower.endsWith('eln')) {
            return tok.charAt(0).toUpperCase() + tok.slice(1);
          }

          // 规则 5：单字名词翻译（如“苹果”-> Apfel，“山”-> Berg）
          if (len === 1 && !lower.endsWith('en') && !lower.endsWith('lich') && !lower.endsWith('ig') && !lower.endsWith('isch')) {
            return tok.charAt(0).toUpperCase() + tok.slice(1);
          }

          return tok;
        });

        // 首字母如果是非冠词/介词，保证开头大写
        if (capitalizedTokens.length > 0) {
          const firstLower = capitalizedTokens[0].toLowerCase();
          if (!germanArticles.has(firstLower) && !germanPrepositions.has(firstLower)) {
            capitalizedTokens[0] = capitalizedTokens[0].charAt(0).toUpperCase() + capitalizedTokens[0].slice(1);
          }
        }

        return capitalizedTokens.join(' ');
      }).join('');
    }

    function speakCharWithPinyin(char, py) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      let spokenText = char;
      if (POLYPHONE_SPEECH_MAP[char]) {
        for (let targetPy in POLYPHONE_SPEECH_MAP[char]) {
          if (py.includes(targetPy) || pinyin(char, { toneType: 'none' }) === targetPy) {
            spokenText = POLYPHONE_SPEECH_MAP[char][targetPy];
            break;
          }
        }
      }

      const utterance = new SpeechSynthesisUtterance(spokenText);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.85;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.85;
      utterance.pitch = 1.0;

    // 8. 外语发音朗读器
    let activeAudioPlayer = null;
    function speakForeignTextSafe(encodedText, targetLang) {
      if (!encodedText || targetLang === 'none') return;
      
      const rawText = decodeURIComponent(encodedText);
      let cleanText = rawText.replace(/^\d+\.\s*/, '').split(/[\/;,\(]/)[0].trim();
      if (!cleanText) cleanText = rawText;

      const langCode = LANG_TTS_MAP[targetLang] || 'en-US';

      if (activeAudioPlayer) {
        activeAudioPlayer.pause();
        activeAudioPlayer = null;
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = langCode;
        utterance.rate = 0.9;
        utterance.pitch = 1.0;

        const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
        const bestVoice = voices.find(v => (v.lang === langCode || v.lang.startsWith(targetLang)) && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Premium') || v.name.includes('Siri'))) 
                       || voices.find(v => v.lang === langCode || v.lang.startsWith(targetLang));

        if (bestVoice) {
          utterance.voice = bestVoice;
        }

        let hasSpoken = false;
        utterance.onstart = () => { hasSpoken = true; };

        setTimeout(() => {
          if (!hasSpoken && !window.speechSynthesis.speaking) {
            playGoogleTtsAudio(cleanText, targetLang);
          }
        }, 250);

        try {
          window.speechSynthesis.speak(utterance);
          return;
        } catch (err) {
          console.warn('本地语音合成异常，转入在线音频保底:', err);
        }
      }

      playGoogleTtsAudio(cleanText, targetLang);
    }

    function playGoogleTtsAudio(text, targetLang) {
      try {
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${targetLang}&q=${encodeURIComponent(text)}`;
        activeAudioPlayer = new Audio(ttsUrl);
        activeAudioPlayer.play().catch(e => {
          console.warn('在线 TTS 播放受限:', e);
        });
      } catch (e) {
        console.error('音频引擎初始化异常:', e);
      }
    }

    // 9. Google AI 翻译引擎集成（集成全量德语名词大写算法）
    async function fetchGoogleTranslate(text, targetLang) {
      if (targetLang === 'none' || !text) return null;

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=${targetLang}&dt=t&dt=bd&dt=rm&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        
        let mainTranslation = '';
        if (data && data[0]) {
          mainTranslation = data[0].map(item => item[0]).filter(Boolean).join('').trim();
        }

        const candidateSet = new Set();
        if (mainTranslation) {
          candidateSet.add(mainTranslation);
        }

        if (data && data[1] && Array.isArray(data[1])) {
          data[1].forEach(entry => {
            if (Array.isArray(entry[1])) {
              entry[1].slice(0, 3).forEach(w => candidateSet.add(w));
            }
          });
        }

        let candidates = Array.from(candidateSet).slice(0, 3);
        
        // 全量德语正字法大写规范化
        if (targetLang === 'de') {
          candidates = candidates.map(w => universalGermanCapitalize(w, text));
          mainTranslation = universalGermanCapitalize(mainTranslation, text);
        }

        const formattedMeaning = candidates.length > 0 
          ? candidates.map((c, i) => `${i + 1}. ${c}`).join('   ')
          : mainTranslation;

        return {
          meaning: formattedMeaning,
          primary: mainTranslation || candidates[0] || ''
        };
      } catch (e) {
        console.warn('Google 翻译调度异常:', e);
      }
      return null;
    }

    // 10. 通用多语言与语法解析入口
    async function getUniversalPhraseDetails(phrase, targetLang) {
      if (targetLang === 'none' || !phrase) {
        return { hsk: '', meaning: '', usage: '', primary: '' };
      }

      if (RICH_PHRASE_DB[phrase]) {
        const item = RICH_PHRASE_DB[phrase];
        let m = item.meaning[targetLang] || item.meaning['en'];
        if (targetLang === 'de') m = universalGermanCapitalize(m, phrase);
        return {
          hsk: item.hsk,
          meaning: m,
          usage: item.usage ? (item.usage[targetLang] || item.usage['en']) : '',
          primary: m.replace(/\d+\.\s*/g, '').split(/[\/;]/)[0].trim()
        };
      }

      let meaningResult = '释义获取中...';
      let primaryWord = '';
      const googleRes = await fetchGoogleTranslate(phrase, targetLang);
      if (googleRes && googleRes.meaning) {
        meaningResult = googleRes.meaning;
        primaryWord = googleRes.primary;
      } else {
        meaningResult = '点击补充词语释义';
      }

      let dynamicUsage = '';
      if (phrase.startsWith('太') && phrase.endsWith('了')) {
        dynamicUsage = `太 + Adj + 了 ➔ (Exclamatory / Degree Pattern)`;
      } else if (phrase.includes('不') || phrase.includes('没')) {
        dynamicUsage = `不 / 没 + Verb / Adj ➔ (Negation)`;
      }

      return {
        hsk: 'HSK',
        meaning: meaningResult,
        usage: dynamicUsage,
        primary: primaryWord
      };
    }

        delayBetweenStrokes: 120
      });
      writer.animateCharacter();
    }

    window.onload = generateSheet;
  </script>
</body>
