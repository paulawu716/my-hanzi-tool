<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>洪恩识字风格多功能汉字演变与描红字帖</title>
  <!-- 引入汉字笔顺库与拼音库 -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.3/dist/index.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
    }

    /* 顶部控制栏 */
    .controls {
      background: #fff;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 980px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .controls input {
      flex: 3;
      min-width: 260px;
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
    }
    .controls select {
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      background: #fff;
    }
    .btn {
      padding: 8px 18px;
      font-size: 15px;
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-print { background: #52c41a; }
    .btn:hover { opacity: 0.9; }

    /* A4 纸张排版容器 */
    .sheet-page {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 12mm 15mm;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    /* 词组/字卡单元 */
    .word-block {
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 2px dashed #f0f0f0;
    }

    /* 词条顶部：整词/句型拼音与翻译 */
    .word-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      background: #fafafa;
      padding: 6px 12px;
      border-radius: 6px;
      border-left: 4px solid #1890ff;
    }
    .word-text {
      font-size: 18px;
      font-weight: bold;
      color: #262626;
    }
    .word-pinyin {
      font-size: 14px;
      color: #1890ff;
      font-weight: bold;
    }
    .word-trans {
      font-size: 13px;
      color: #595959;
      background: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px dashed #d9d9d9;
      cursor: text;
      flex: 1;
    }
    .word-trans:focus {
      outline: 1px solid #1890ff;
      background: #e6f7ff;
    }

    /* 洪恩识字核心卡片：单字认知与字理区 */
    .char-card {
      margin-bottom: 14px;
      background: #ffffff;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: 10px;
    }

    /* 识字卡上半部分：象形图、演变、字理口诀与结构属性 */
    .char-cognition-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 6px;
      padding: 6px 10px;
    }

    /* 象形图徽章 */
    .pic-badge {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #ffd591;
      flex-shrink: 0;
    }
    .pic-badge svg {
      width: 34px;
      height: 34px;
    }

    /* 演变轨迹 */
    .evolution-timeline {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .evo-step {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .evo-icon {
      font-size: 15px;
      font-family: "KaiTi", "STKaiti", serif;
      color: #595959;
      height: 20px;
      display: flex;
      align-items: center;
    }
    .evo-name {
      font-size: 9px;
      color: #8c8c8c;
      transform: scale(0.85);
    }
    .evo-arrow {
      color: #d9d9d9;
      font-size: 10px;
    }

    /* 洪恩式记忆口诀与字理故事 */
    .mnemonic-box {
      flex: 1;
      font-size: 12px;
      color: #d46b08;
      line-height: 1.4;
      border-left: 2px dashed #ffd591;
      padding-left: 10px;
    }
    .mnemonic-title {
      font-weight: bold;
      color: #fa8c16;
      margin-bottom: 2px;
    }
    .meta-tags {
      font-size: 11px;
      color: #8c8c8c;
      margin-top: 2px;
    }

    /* 识字卡下半部分：笔顺与米字格描红 */
    .char-practice-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .char-badge {
      width: 50px;
      text-align: center;
      font-size: 14px;
      color: #262626;
      font-weight: bold;
      flex-shrink: 0;
    }
    .char-pinyin-small {
      color: #1890ff;
      font-size: 13px;
    }
    .btn-animate {
      padding: 2px 6px;
      font-size: 10px;
      background: #fa8c16;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin-top: 3px;
    }

    /* 米字格布局 */
    .grid-list {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .mi-grid {
      width: 44px;
      height: 44px;
      border: 1px solid #ff4d4f;
      position: relative;
      background:
        linear-gradient(to top right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px));
      background-size: 100% 100%;
    }

    /* 拓展组词与造句区 */
    .char-words-expand {
      font-size: 11px;
      color: #595959;
      margin-top: 6px;
      padding-top: 4px;
      border-top: 1px dashed #f0f0f0;
      display: flex;
      gap: 16px;
    }
    .char-words-expand span {
      background: #f5f5f5;
      padding: 1px 6px;
      border-radius: 3px;
    }

    /* 打印适配 */
    @media print {
      body { background: transparent; padding: 0; }
      .controls { display: none !important; }
      .sheet-page { box-shadow: none; width: 100%; margin: 0; padding: 0; }
      .btn-animate { display: none; }
      .word-trans { border: none; background: transparent; padding: 0; }
      .char-cognition-row { background: #fff !important; border: 1px solid #ddd; }
      .char-card { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>

  <!-- 控制工具栏 -->
  <div class="controls">
    <input type="text" id="textInput" value="太阳, 月亮, 森林, 高山" placeholder="输入词语/句子，用逗号或空格隔开..." />
    
    <select id="langSelect">
      <option value="en">🇬🇧 英语 (English)</option>
      <option value="de">🇩🇪 德语 (Deutsch)</option>
      <option value="fr">🇫🇷 法语 (Français)</option>
      <option value="es">🇪🇸 西班牙语 (Español)</option>
      <option value="it">🇮🇹 意大利语 (Italiano)</option>
      <option value="pt">🇵🇹 葡萄牙语 (Português)</option>
      <option value="ru">🇷🇺 俄语 (Русский)</option>
      <option value="none">🚫 无翻译</option>
    </select>

    <button class="btn" onclick="generateSheet()">生成字帖</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 打印字帖</button>
  </div>

  <div class="sheet-page" id="sheetContainer"></div>

  <script>
    const { pinyin } = pinyinPro;

    // 洪恩识字风格深度字库：字理象形插画 + 演变 + 识字儿歌/口诀 + 部首结构 + 拓展组词
    const IHUMAN_CHAR_DB = {
      '日': {
        radical: '日', strokes: 4, structure: '独体字',
        rhyme: '圆圆太阳空中挂，照得大地暖洋洋；中间一点是黑子，古人造字叫作日。',
        words: ['日光', '日子', '日月'],
        icon: `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="16" fill="#f5222d"/><g stroke="#fa8c16" stroke-width="4" stroke-linecap="round"><line x1="32" y1="4" x2="32" y2="10"/><line x1="32" y1="54" x2="32" y2="60"/><line x1="4" y1="32" x2="10" y2="32"/><line x1="54" y1="32" x2="60" y2="32"/><line x1="12" y1="12" x2="16" y2="16"/><line x1="48" y1="48" x2="52" y2="52"/><line x1="12" y1="52" x2="16" y2="48"/><line x1="48" y1="16" x2="52" y2="12"/></g></svg>`,
        steps: [{ name: '甲骨', char: '☉' }, { name: '金文', char: '⊙' }, { name: '小篆', char: '⾐' }, { name: '楷书', char: '日' }]
      },
      '月': {
        radical: '月', strokes: 4, structure: '独体字',
        rhyme: '弯弯月儿像小船，两头尖尖挂天边；夜晚悄悄照人间，十五变圆亮晶晶。',
        words: ['月光', '月亮', '岁月'],
        icon: `<svg viewBox="0 0 64 64"><path d="M42,10 A24,24 0 1,0 42,54 A20,20 0 0,1 42,10 Z" fill="#faad14"/></svg>`,
        steps: [{ name: '甲骨', char: '☽' }, { name: '金文', char: '⺼' }, { name: '小篆', char: '月' }, { name: '楷书', char: '月' }]
      },
      '山': {
        radical: '山', strokes: 3, structure: '独体字',
        rhyme: '一座大山高又高，三座山峰连成线；中间峰顶冲入云，高耸挺立就是山。',
        words: ['高山', '山河', '山川'],
        icon: `<svg viewBox="0 0 64 64"><polygon points="32,12 14,52 50,52" fill="#52c41a"/><polygon points="46,24 34,52 58,52" fill="#389e0d"/><polygon points="18,28 6,52 30,52" fill="#73d13d"/></svg>`,
        steps: [{ name: '甲骨', char: 'ⵊ' }, { name: '金文', char: '⽭' }, { name: '小篆', char: '山' }, { name: '楷书', char: '山' }]
      },
      '水': {
        radical: '水', strokes: 4, structure: '独体字',
        rhyme: '溪流弯弯向前淌，两边浪花泛水光；滋润草木和大地，生命之源清又亮。',
        words: ['流水', '泉水', '水果'],
        icon: `<svg viewBox="0 0 64 64"><path d="M10,40 Q20,30 32,40 T54,40 M10,48 Q20,38 32,48 T54,48" fill="none" stroke="#1890ff" stroke-width="5" stroke-linecap="round"/></svg>`,
        steps: [{ name: '甲骨', char: '川' }, { name: '金文', char: '水' }, { name: '小篆', char: '氺' }, { name: '楷书', char: '水' }]
      },
      '木': {
        radical: '木', strokes: 4, structure: '独体字',
        rhyme: '一横为枝一竖干，撇捺伸出大树根；春天发芽夏日绿，一棵大树立天地。',
        words: ['树木', '木头', '草木'],
        icon: `<svg viewBox="0 0 64 64"><circle cx="32" cy="24" r="16" fill="#52c41a"/><rect x="28" y="32" width="8" height="24" fill="#873800"/></svg>`,
        steps: [{ name: '甲骨', char: '木' }, { name: '金文', char: '木' }, { name: '小篆', char: '木' }, { name: '楷书', char: '木' }]
      },
      '林': {
        radical: '木', strokes: 8, structure: '左右结构',
        rhyme: '一木成树双木林，两棵大树手拉手；鸟儿枝头唱新曲，绿色树林美如画。',
        words: ['树林', '竹林', '林海'],
        icon: `<svg viewBox="0 0 64 64"><circle cx="22" cy="26" r="12" fill="#52c41a"/><rect x="19" y="34" width="6" height="20" fill="#873800"/><circle cx="42" cy="22" r="14" fill="#389e0d"/><rect x="39" y="32" width="6" height="22" fill="#873800"/></svg>`,
        steps: [{ name: '甲骨', char: '木木' }, { name: '金文', char: '林' }, { name: '小篆', char: '林' }, { name: '楷书', char: '林' }]
      },
      '森': {
        radical: '木', strokes: 12, structure: '品字形结构',
        rhyme: '三木聚会变成森，树木茂密遮天日；小鹿小兔捉迷藏，神秘森林生机旺。',
        words: ['森林', '阴森', '森严'],
        icon: `<svg viewBox="0 0 64 64"><circle cx="32" cy="18" r="10" fill="#237804"/><rect x="30" y="24" width="4" height="12" fill="#612500"/><circle cx="18" cy="38" r="10" fill="#52c41a"/><rect x="16" y="44" width="4" height="12" fill="#612500"/><circle cx="46" cy="38" r="10" fill="#389e0d"/><rect x="44" y="44" width="4" height="12" fill="#612500"/></svg>`,
        steps: [{ name: '金文', char: '森' }, { name: '小篆', char: '森' }, { name: '隶书', char: '森' }, { name: '楷书', char: '森' }]
      },
      '高': {
        radical: '高', strokes: 10, structure: '上中下结构',
        rhyme: '一层楼台一层顶，高高耸立如宝塔；站得高来望得远，红日蓝天看得清。',
        words: ['高山', '高兴', '高大'],
        icon: `<svg viewBox="0 0 64 64"><path d="M32,8 L48,22 L16,22 Z" fill="#fa8c16"/><rect x="22" y="22" width="20" height="34" fill="#d46b08"/><rect x="27" y="36" width="10" height="20" fill="#fff"/></svg>`,
        steps: [{ name: '甲骨', char: '高' }, { name: '金文', char: '高' }, { name: '小篆', char: '高' }, { name: '楷书', char: '高' }]
      },
      '阳': {
        radical: '阝', strokes: 6, structure: '左右结构',
        rhyme: '左边山丘右边日，太阳照射暖意升；阳气升腾万物长，朝气蓬勃笑开颜。',
        words: ['阳光', '太阳', '阳台'],
        icon: `<svg viewBox="0 0 64 64"><circle cx="36" cy="28" r="12" fill="#fa8c16"/><path d="M12,52 L26,24 L38,52 Z" fill="#8c8c8c"/></svg>`,
        steps: [{ name: '甲骨', char: '昜' }, { name: '金文', char: '陽' }, { name: '小篆', char: '陽' }, { name: '楷书', char: '阳' }]
      },
      '亮': {
        radical: '亠', strokes: 9, structure: '上中下结构',
        rhyme: '夜幕降临星光闪，灯火通明如白昼；双眼清澈如泉水，亮亮堂堂好心情。',
        words: ['明亮', '亮晶晶', '光亮'],
        icon: `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="10" fill="#ffd666"/><g stroke="#faad14" stroke-width="3"><line x1="32" y1="12" x2="32" y2="18"/><line x1="32" y1="46" x2="32" y2="52"/><line x1="12" y1="32" x2="18" y2="32"/><line x1="46" y1="32" x2="52" y2="32"/></g></svg>`,
        steps: [{ name: '甲骨', char: '高' }, { name: '金文', char: '亮' }, { name: '小篆', char: '亮' }, { name: '楷书', char: '亮' }]
      }
    };

    // 常用短语精准备用库
    const PHRASE_DICT = {
      '太阳': { en: 'sun', de: 'die Sonne', fr: 'le soleil', es: 'el sol', it: 'il sole', pt: 'o sol', ru: 'солнце' },
      '月亮': { en: 'moon', de: 'der Mond', fr: 'la lune', es: 'la luna', it: 'la luna', pt: 'a lua', ru: 'луна' },
      '高山': { en: 'high mountain', de: 'hoher Berg', fr: 'haute montagne', es: 'alta montaña', it: 'alta montagna', pt: 'alta montanha', ru: 'высокая гора' },
      '森林': { en: 'forest', de: 'der Wald', fr: 'la forêt', es: 'el bosque', it: 'la foresta', pt: 'a floresta', ru: 'лес' }
    };

    // 通用汉字回退解析
    function getDefaultCognition(char) {
      return {
        radical: '部首', strokes: '多笔', structure: '汉字结构',
        rhyme: `仔细观察「${char}」的字形特征，一笔一画写端正。`,
        words: [`${char}字`, `学${char}`],
        icon: `<svg viewBox="0 0 64 64"><rect x="12" y="12" width="40" height="40" rx="8" fill="#f0f2f5"/><text x="32" y="38" font-size="20" text-anchor="middle" fill="#8c8c8c">${char}</text></svg>`,
        steps: [{ name: '古文', char: char }, { name: '小篆', char: char }, { name: '隶书', char: char }, { name: '楷书', char: char }]
      };
    }

    async function getPhraseTranslation(phrase, targetLang) {
      if (targetLang === 'none') return '';
      if (PHRASE_DICT[phrase] && PHRASE_DICT[phrase][targetLang]) {
        return PHRASE_DICT[phrase][targetLang];
      }
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(phrase)}&langpair=zh-CN|${targetLang}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data?.responseData?.translatedText) {
          const trans = data.responseData.translatedText.trim();
          if (!trans.startsWith('MYMEMORY WARNING')) return trans;
        }
      } catch (e) {
        console.warn('在线词组翻译失败:', e);
      }
      return '点击补充完整释义';
    }

    async function generateSheet() {
      const container = document.getElementById('sheetContainer');
      const text = document.getElementById('textInput').value.trim();
      const targetLang = document.getElementById('langSelect').value;
      container.innerHTML = '';

      const phrases = text.split(/[,，;；\n\s]+/).filter(item => item.trim().length > 0);
      if (phrases.length === 0) {
        alert('请输入有效的中文词语或句子！');
        return;
      }

      let globalGridIdx = 0;

      for (let pIdx = 0; pIdx < phrases.length; pIdx++) {
        const rawPhrase = phrases[pIdx];
        const chars = (rawPhrase.match(/[\u4e00-\u9fa5]/g) || []).join('');
        if (!chars) continue;

        const phrasePinyin = pinyin(chars, { toneType: 'symbol' });
        const transBoxId = `trans-box-${pIdx}`;

        const wordBlock = document.createElement('div');
        wordBlock.className = 'word-block';

        // 词条顶部头部
        wordBlock.innerHTML = `
          <div class="word-header">
            <span class="word-text">${chars}</span>
            <span class="word-pinyin">[ ${phrasePinyin} ]</span>
            <div class="word-trans" id="${transBoxId}" contenteditable="true" title="点击可编辑释义">${targetLang === 'none' ? '' : '翻译获取中...'}</div>
          </div>
        `;

        // 逐字生成洪恩识字风格识字卡
        for (let cIdx = 0; cIdx < chars.length; cIdx++) {
          const char = chars[cIdx];
          const charPy = pinyin(char, { toneType: 'symbol' });
          const firstGridId = `grid-demo-${globalGridIdx}`;

          const charData = IHUMAN_CHAR_DB[char] || getDefaultCognition(char);
          const stepsHtml = charData.steps.map((s, idx) => `
            <div class="evo-step">
              <span class="evo-icon">${s.char}</span>
              <span class="evo-name">${s.name}</span>
            </div>
            ${idx < charData.steps.length - 1 ? '<span class="evo-arrow">→</span>' : ''}
          `).join('');

          const card = document.createElement('div');
          card.className = 'char-card';

          // 1. 洪恩识字四步法上部：看图 + 溯源 + 口诀儿歌 + 部首属性
          card.innerHTML = `
            <div class="char-cognition-row">
              <div class="pic-badge" title="${char} 的象形实物图">${charData.icon}</div>
              <div class="evolution-timeline">${stepsHtml}</div>
              <div class="mnemonic-box">
                <div class="mnemonic-title">💡 洪恩识字口诀：</div>
                <div>${charData.rhyme}</div>
                <div class="meta-tags">【部首: ${charData.radical} | 结构: ${charData.structure} | 笔画: ${charData.strokes}画】</div>
              </div>
            </div>
          `;

          // 2. 识字下部：笔顺演示 + 描红米字格
          const practiceRow = document.createElement('div');
          practiceRow.className = 'char-practice-row';

          const charBadge = document.createElement('div');
          charBadge.className = 'char-badge';
          charBadge.innerHTML = `
            <div class="char-pinyin-small">${charPy}</div>
            <button class="btn-animate" onclick="playStroke('${firstGridId}', '${char}')">▶ 笔顺</button>
          `;
          practiceRow.appendChild(charBadge);

          // 米字格（1示范 + 2描红 + 3练习）
          const gridList = document.createElement('div');
          gridList.className = 'grid-list';
          
          const totalGrids = 6;
          const currentGrids = [];
          for (let g = 0; g < totalGrids; g++) {
            const grid = document.createElement('div');
            grid.className = 'mi-grid';
            grid.id = (g === 0) ? firstGridId : `grid-${globalGridIdx}-${g}`;
            gridList.appendChild(grid);
            currentGrids.push(grid.id);
          }
          practiceRow.appendChild(gridList);
          card.appendChild(practiceRow);

          // 3. 拓展常用词
          const wordsExpand = document.createElement('div');
          wordsExpand.className = 'char-words-expand';
          wordsExpand.innerHTML = `<strong>常用词组：</strong> ${charData.words.map(w => `<span>${w}</span>`).join(' ')}`;
          card.appendChild(wordsExpand);

          wordBlock.appendChild(card);
          container.appendChild(wordBlock);

          // 渲染示范字
          HanziWriter.create(firstGridId, char, {
            width: 44, height: 44, padding: 3, strokeColor: '#000000', showOutline: false
          });

          // 渲染描红浅灰字
          for (let g = 1; g <= 2; g++) {
            HanziWriter.create(currentGrids[g], char, {
              width: 44, height: 44, padding: 3, strokeColor: '#d4d4d4', showOutline: false
            });
          }

          globalGridIdx++;
        }

        // 异步填充整词完整翻译
        if (targetLang !== 'none') {
          getPhraseTranslation(chars, targetLang).then(res => {
            const transEl = document.getElementById(transBoxId);
            if (transEl) transEl.innerText = res;
          });
        }
      }
    }

    function playStroke(elementId, char) {
      const targetElem = document.getElementById(elementId);
      targetElem.innerHTML = '';
      const writer = HanziWriter.create(elementId, char, {
        width: 44, height: 44, padding: 3,
        strokeColor: '#1890ff',
        strokeAnimationSpeed: 1.2,
        delayBetweenStrokes: 120
      });
      writer.animateCharacter();
    }

    window.onload = generateSheet;
  </script>
</body>
</html>
