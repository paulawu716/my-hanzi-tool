<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多语言汉字甲骨文与词语句型语法字帖系统</title>
  <!-- 引入汉字笔顺库与拼音库 -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.3/dist/index.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
    }

    /* 顶部控制栏 */
    .controls {
      background: #fff;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 1060px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .controls input {
      flex: 3;
      min-width: 280px;
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
    }
    .controls select {
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      background: #fff;
    }
    .btn {
      padding: 9px 18px;
      font-size: 15px;
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-print { background: #52c41a; }
    .btn:hover { opacity: 0.9; }

    /* A4 纸张排版容器 */
    .sheet-page {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 12mm 14mm;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    /* 词语/句型单元块 */
    .word-block {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px dashed #eaeaea;
    }

    /* 词条顶部：左侧词句与拼音语音，右侧整词/句型解析条框 */
    .word-header {
      display: flex;
      align-items: stretch;
      gap: 14px;
      margin-bottom: 12px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 6px;
      border-left: 4px solid #1890ff;
    }
    .word-meta-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-width: 150px;
    }
    .word-text-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .word-text {
      font-size: 20px;
      font-weight: bold;
      color: #1e293b;
    }
    .btn-audio {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      color: #096dd9;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .btn-audio:hover {
      background: #bae7ff;
    }
    .word-pinyin {
      font-size: 14px;
      color: #1890ff;
      font-weight: 600;
    }

    /* 词语/句型右侧条框：多重释义 + 句型结构与语法用法 */
    .word-trans-box {
      flex: 1;
      background: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px dashed #cbd5e1;
      cursor: text;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
    }
    .word-trans-box:focus {
      outline: 1px solid #1890ff;
      background: #f0fdf4;
    }
    .trans-meaning-line {
      color: #1e293b;
      font-weight: 500;
      line-height: 1.4;
    }
    .trans-usage-line {
      font-size: 12px;
      color: #0284c7;
      background: #f0f9ff;
      padding: 3px 8px;
      border-radius: 4px;
      line-height: 1.4;
      border-left: 3px solid #38bdf8;
    }

    /* 单字卡片：单行严格对齐（无折行） */
    .char-card {
      margin-bottom: 10px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: hidden;
    }

    /* 左侧：专属象形配图 + 单一甲骨文链接节点 */
    .char-left-zone {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .pic-badge {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .pic-badge svg {
      width: 36px;
      height: 36px;
    }

    /* 甲骨文链接单个节点 */
    .oracle-link-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border: 1px solid #edf2f7;
      padding: 2px 6px;
      border-radius: 6px;
      text-decoration: none;
      color: #334155;
      width: 42px;
      height: 44px;
      transition: all 0.2s;
    }
    .oracle-link-badge:hover {
      border-color: #1890ff;
      background: #e6f7ff;
    }
    .oracle-glyph {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .oracle-glyph svg {
      width: 22px;
      height: 22px;
      fill: #334155;
    }
    .oracle-label {
      font-size: 9px;
      color: #8c8c8c;
      transform: scale(0.85);
      margin-top: 1px;
    }

    /* 中间：单字多音字读音 + 笔顺演示 + 朗读 */
    .char-badge {
      width: 55px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .char-pinyin-small {
      color: #1890ff;
      font-size: 13.5px;
      font-weight: bold;
    }
    .btn-action-group {
      display: flex;
      gap: 3px;
    }
    .btn-small-audio {
      padding: 1px 4px;
      font-size: 10px;
      background: #52c41a;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-animate {
      padding: 1px 4px;
      font-size: 10px;
      background: #fa8c16;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    /* 右侧：单列米字格/田字格（绝不换行） */
    .grid-list {
      display: flex;
      gap: 5px;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }
    .mi-grid {
      width: 38px;
      height: 38px;
      border: 1px solid #ff4d4f;
      position: relative;
      background:
        linear-gradient(to top right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px));
      background-size: 100% 100%;
    }

    /* 打印适配 */
    @media print {
      body { background: transparent; padding: 0; }
      .controls { display: none !important; }
      .sheet-page { box-shadow: none; width: 100%; margin: 0; padding: 0; }
      .btn-animate, .btn-audio, .btn-small-audio { display: none !important; }
      .word-trans-box { border: none; background: transparent; padding: 0; }
      .char-card { border: 1px solid #94a3b8; }
    }
  </style>
</head>
<body>

  <!-- 控制工具栏 -->
  <div class="controls">
    <input type="text" id="textInput" value="中国银行, 睡觉, 觉得, 快乐, 音乐, 车马" placeholder="输入词语、短语或句型，用逗号或空格隔开..." />
    
    <select id="langSelect" onchange="generateSheet()">
      <option value="de">🇩🇪 德语 (Deutsch)</option>
      <option value="en">🇬🇧 英语 (English)</option>

      <option value="ru">🇷🇺 俄语 (Русский)</option>
      <option value="none">🚫 无翻译</option>

    <button class="btn" onclick="generateSheet()">生成字帖</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 打印字帖</button>
  </div>

  <div class="sheet-page" id="sheetContainer"></div>

      '快乐': {

    // 3. 多音字语境识别（整词上下文提取）
    function getContextualPinyinList(phrase) {
      return pinyin(phrase, { toneType: 'symbol', type: 'array' });
    }

    // 4. 多音字精准发音对齐引擎 (Phonetic Alignment Engine)
    // 建立多音字特定读音到发音锚定词的映射表，确保浏览器 TTS 引擎读出的声音与拼音 100% 一致
    const POLYPHONE_SPEECH_MAP = {
      '行': {
        'háng': '航', // 读 háng 时发“航”音 (如银行、行业)
        'xíng': '形'  // 读 xíng 时发“形”音 (如行走、不行)
      },
      '觉': {
        'jiào': '叫', // 读 jiào 时发“叫”音 (如睡觉)
        'jué': '决'   // 读 jué 时发“决”音 (如觉得、感觉)
      },
      '乐': {
        'yuè': '月',  // 读 yuè 时发“月”音 (如音乐、乐器)
        'lè': '勒'    // 读 lè 时发“勒”音 (如快乐、乐观)
      },
      '重': {
        'zhòng': '众', // 读 zhòng 时发“众”音 (如重要、重量)
        'chóng': '虫'  // 读 chóng 时发“虫”音 (如重复、重申)
      },
      '数': {
        'shù': '树',  // 读 shù 时发“树”音 (如数量、数学)
        'shǔ': '暑'   // 读 shǔ 时发“暑”音 (如数一数、不可胜数)
      },
      '发': {
        'fā': '八',   // 读 fā 时发“发”音 (如发现、发生)
        'fà': '法'    // 读 fà 时发“发”音 (如头发)
      },
      '地': {
        'de': '的',   // 读 de 时发轻声 (如慢慢地)
        'dì': '弟'    // 读 dì 时发“弟”音 (如大地、地方)
      },
      '长': {
        'cháng': '常', // 读 cháng 时发“常”音 (如长江、长度)
        'zhǎng': '掌'  // 读 zhǎng 时发“掌”音 (如长大、长辈)
      },
      '得': {
        'dé': '德',   // 读 dé 时 (如得到)
        'de': '的',   // 读 de 时 (如跑得快)
        'děi': '待'   // 读 děi 时 (如总得、得去)
      },
      '着': {
        'zhe': '者',  // 读 zhe 时 (如看着)
        'zháo': '找', // 读 zháo 时 (如着火、着急)
        'zhuó': '卓'  // 读 zhuó 时 (如沉着、着重)
      }
    };

    // 朗读单字并自动纠正多音字发音
    function speakCharWithPinyin(char, py) {
      if (!('speechSynthesis' in window)) {
        alert('当前浏览器暂不支持语音朗读功能');
        return;
      }
      window.speechSynthesis.cancel();

      // 去除声调符号获得纯拼音 (如 háng -> hang)
      let spokenText = char;
      if (POLYPHONE_SPEECH_MAP[char]) {
        for (let targetPy in POLYPHONE_SPEECH_MAP[char]) {
          // 匹配带调拼音或不带调拼音
          if (py.includes(targetPy) || pinyin(char, { toneType: 'none' }) === targetPy) {
            spokenText = POLYPHONE_SPEECH_MAP[char][targetPy];
            break;
          }
        }
      }

      const utterance = new SpeechSynthesisUtterance(spokenText);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.85;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // 朗读整词
    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        alert('当前浏览器暂不支持语音朗读功能');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.85;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // 5. 通用在线多义项翻译与句型结构用法解析
    async function getUniversalPhraseDetails(phrase, targetLang) {
      if (targetLang === 'none' || !phrase) {
        return { meaning: '', usage: '' };
      }

      if (PHRASE_USAGE_DB[phrase]) {
        const m = PHRASE_USAGE_DB[phrase].meaning[targetLang] || PHRASE_USAGE_DB[phrase].meaning['en'];
        const u = PHRASE_USAGE_DB[phrase].usage[targetLang] || PHRASE_USAGE_DB[phrase].usage['en'];
        return { meaning: m, usage: u };
      }

      let meaningResult = '释义获取中...';
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(phrase)}&langpair=zh-CN|${targetLang}`;
        const res = await fetch(url);
        const data = await res.json();
        
        const candidateSet = new Set();
        if (data?.responseData?.translatedText) {
          const mainTrans = data.responseData.translatedText.trim();
          if (!mainTrans.startsWith('MYMEMORY WARNING') && !mainTrans.includes('QUERY LENGTH LIMIT')) {
            candidateSet.add(mainTrans.toLowerCase());
          }
        }
        if (Array.isArray(data?.matches)) {
          data.matches.forEach(m => {
            if (m.translation && m.quality > 40) {
              const clean = m.translation.trim().toLowerCase();
              if (!clean.includes('http') && clean !== phrase.toLowerCase() && clean.length < 40) {
                candidateSet.add(clean);
              }
            }
          });
        }
        const candidates = Array.from(candidateSet).slice(0, 3);
        if (candidates.length > 0) {
          meaningResult = candidates.map((c, i) => `${i + 1}. ${c}`).join('   ');
        }
      } catch (e) {
        meaningResult = '点击补充词语释义';
      }

      let inferredStructure = `【句型与用法】`;
      if (phrase.startsWith('太') && phrase.endsWith('了')) {
        inferredStructure = `【句型结构】太 + 形容词/动词 + 了 ➔ 表示程度极高或过分 (Too / Zu + Adj)`;
      } else if (phrase.includes('不') || phrase.includes('没')) {
        inferredStructure = `【否定句式】不 / 没 + 动词/形容词 ➔ 表示否定结构 (Negation)`;
      } else {
        inferredStructure = `【词语用法】常用中文词组/表达，请结合语境在句中作主语、谓语或宾语。`;
      }

      const usageTips = {
        de: `${inferredStructure} (Im deutschen Satzkontext anwenden)`,
        en: `${inferredStructure} (Apply according to context)`,
        es: `${inferredStructure} (Usar según la función sintáctica)`,
        fr: `${inferredStructure} (À employer selon la syntaxe)`,
        it: `${inferredStructure} (Da applicare secondo il contesto)`,
        pt: `${inferredStructure} (Usar conforme o contexto sintático)`,
        ru: `${inferredStructure} (Используется в соответствии с контекстом)`
      };

      return {
        meaning: meaningResult,
        usage: usageTips[targetLang] || usageTips['en']
      };
    }

    // 6. 获取汉字配图与甲骨文单一数据
    function getCharVisualData(char) {
      if (CHAR_IMAGE_ORACLE_DB[char]) {
        return CHAR_IMAGE_ORACLE_DB[char];
      }
      return {
        icon: `<svg viewBox="0 0 64 64"><rect x="6" y="6" width="52" height="52" rx="8" fill="#1890ff" fill-opacity="0.1"/><text x="32" y="40" font-size="24" font-weight="bold" fill="#1890ff" text-anchor="middle">${char}</text></svg>`,
        oracle: null
      };
    }

    // 7. 生成字帖核心函数
    async function generateSheet() {
      const container = document.getElementById('sheetContainer');
      const text = document.getElementById('textInput').value.trim();
      const targetLang = document.getElementById('langSelect').value;
      container.innerHTML = '';

      const phrases = text.split(/[,，;；\n\s]+/).filter(item => item.trim().length > 0);
      if (phrases.length === 0) {
        alert('请输入有效的中文词语或句子！');
        return;
      }

      let globalGridIdx = 0;

      for (let pIdx = 0; pIdx < phrases.length; pIdx++) {
        const rawPhrase = phrases[pIdx];
        const chars = (rawPhrase.match(/[\u4e00-\u9fa5]/g) || []).join('');
        if (!chars) continue;

        const contextualPinyins = getContextualPinyinList(chars);
        const phrasePinyinStr = contextualPinyins.join(' ');
        
        const transMeaningId = `trans-meaning-${pIdx}`;
        const transUsageId = `trans-usage-${pIdx}`;

        const wordBlock = document.createElement('div');
        wordBlock.className = 'word-block';

        // 词条顶部头部：左侧词句与拼音语音 + 右侧集中展示词义与句型结构用法
        wordBlock.innerHTML = `
          <div class="word-header">
            <div class="word-meta-left">
              <div class="word-text-line">
                <span class="word-text">${chars}</span>
                <button class="btn-audio" onclick="speakText('${chars}')">🔊 朗读</button>
              </div>
              <div class="word-pinyin">[ ${phrasePinyinStr} ]</div>
            </div>
            <div class="word-trans-box" contenteditable="true" title="点击可直接编辑修改词语含义与句型用法">
              <div class="trans-meaning-line" id="${transMeaningId}">${targetLang === 'none' ? '' : '词语多义项解析中...'}</div>
              <div class="trans-usage-line" id="${transUsageId}">${targetLang === 'none' ? '' : '句型结构与用法加载中...'}</div>
            </div>
          </div>
        `;

        // 逐字生成纯净字卡（单字不带任何释义，仅专属插图、甲骨文单链接、多音字精准发音与单列描红）
        for (let cIdx = 0; cIdx < chars.length; cIdx++) {
          const char = chars[cIdx];
          const charPy = contextualPinyins[cIdx] || pinyin(char, { toneType: 'symbol' });
          const firstGridId = `grid-demo-${globalGridIdx}`;

          const visualData = getCharVisualData(char);

          // 仅存在甲骨文时才生成单个甲骨文点击链接
          const oracleHtml = visualData.oracle ? `
            <a class="oracle-link-badge" href="https://hanziyuan.net/#${encodeURIComponent(char)}" target="_blank" title="在字源网 (hanziyuan.net) 查看「${char}」的甲骨文原图考据">
              <div class="oracle-glyph">${visualData.oracle}</div>
              <div class="oracle-label">甲骨文</div>
            </a>
          ` : '';

          const card = document.createElement('div');
          card.className = 'char-card';

          card.innerHTML = `
            <!-- 左侧：专属配图 + 单一甲骨文演变链接 (若无甲骨文则不显示) -->
            <div class="char-left-zone">
              <div class="pic-badge" title="${char} 的专属图解">${visualData.icon}</div>
              ${oracleHtml}
            </div>

            <!-- 中间：单字多音字读音 + 笔顺演示 + 多音字纠正发音按钮 -->
            <div class="char-badge">
              <div class="char-pinyin-small">${charPy}</div>
              <div class="btn-action-group">
                <button class="btn-small-audio" onclick="speakCharWithPinyin('${char}', '${charPy}')" title="按当前语境拼音朗读该字">🔊</button>
                <button class="btn-animate" onclick="playStroke('${firstGridId}', '${char}')" title="播放笔顺">▶ 笔顺</button>
              </div>
            </div>

            <!-- 右侧：严格保持单列水平排列的米字格/田字格 -->
            <div class="grid-list" id="grid-list-${globalGridIdx}"></div>
          `;

          // 插入单列米字格（1个示范黑字 + 2个描红浅灰字 + 5个空白练习格，共8格单行）
          const gridList = card.querySelector(`#grid-list-${globalGridIdx}`);
          const totalGrids = 8;
          const currentGrids = [];
          for (let g = 0; g < totalGrids; g++) {
            const grid = document.createElement('div');
            grid.className = 'mi-grid';
            grid.id = (g === 0) ? firstGridId : `grid-${globalGridIdx}-${g}`;
            gridList.appendChild(grid);
            currentGrids.push(grid.id);
          }

          wordBlock.appendChild(card);
          container.appendChild(wordBlock);

          // 渲染黑字示范
          HanziWriter.create(firstGridId, char, {
            width: 38, height: 38, padding: 2, strokeColor: '#000000', showOutline: false
          });

          // 渲染描红浅灰字
          for (let g = 1; g <= 2; g++) {
            HanziWriter.create(currentGrids[g], char, {
              width: 38, height: 38, padding: 2, strokeColor: '#d4d4d4', showOutline: false
            });
          }

          globalGridIdx++;
        }

        // 异步填充整词/句型的多重释义与用法
        if (targetLang !== 'none') {
          getUniversalPhraseDetails(chars, targetLang).then(res => {
            const mEl = document.getElementById(transMeaningId);
            const uEl = document.getElementById(transUsageId);
            if (mEl) mEl.innerText = res.meaning;
            if (uEl) uEl.innerText = res.usage;
          });
        }
      }
    }

    // 播放单字笔顺动画
    function playStroke(elementId, char) {
      const targetElem = document.getElementById(elementId);
      targetElem.innerHTML = '';
      const writer = HanziWriter.create(elementId, char, {
        width: 38, height: 38, padding: 2,
        strokeColor: '#1890ff',
        strokeAnimationSpeed: 1.2,
        delayBetweenStrokes: 120
      });
      writer.animateCharacter();
    }

    window.onload = generateSheet;
  </script>
