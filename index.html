<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多语言汉字语法图解与笔顺描红字帖</title>
  <!-- 引入汉字笔顺库与拼音库 -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.3/dist/index.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
    }

    /* 顶部控制栏 */
    .controls {
      background: #fff;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 1000px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .controls input {
      flex: 3;
      min-width: 260px;
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
    }
    .controls select {
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      background: #fff;
    }
    .btn {
      padding: 8px 18px;
      font-size: 15px;
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-print { background: #52c41a; }
    .btn:hover { opacity: 0.9; }

    /* A4 打印纸张容器 */
    .sheet-page {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 12mm 15mm;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    /* 词组/整句单元块 */
    .word-block {
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 2px dashed #e8e8e8;
    }

    /* 词条顶部：整词/句型拼音与翻译 */
    .word-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
      padding: 6px 12px;
      border-radius: 6px;
      border-left: 4px solid #1890ff;
    }
    .word-text {
      font-size: 18px;
      font-weight: bold;
      color: #1e293b;
    }
    .word-pinyin {
      font-size: 14px;
      color: #1890ff;
      font-weight: bold;
    }
    .word-trans {
      font-size: 13px;
      color: #475569;
      background: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px dashed #cbd5e1;
      cursor: text;
      flex: 1;
    }
    .word-trans:focus {
      outline: 1px solid #1890ff;
      background: #f0fdf4;
    }

    /* 单字知识卡片 */
    .char-card {
      margin-bottom: 14px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
    }

    /* 第一行：图片 + 字体演变 + 语法句型解构 */
    .char-cognition-row {
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 6px;
      padding: 8px 10px;
    }

    /* 精选具象插画 */
    .pic-badge {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .pic-badge svg {
      width: 42px;
      height: 42px;
    }

    /* 字体演变轨迹 */
    .evolution-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 8px;
      border-right: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .evolution-timeline {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .evo-step {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .evo-icon {
      font-size: 16px;
      font-family: "KaiTi", "STKaiti", serif;
      color: #334155;
      height: 22px;
      display: flex;
      align-items: center;
    }
    .evo-name {
      font-size: 9px;
      color: #94a3b8;
      transform: scale(0.85);
    }
    .evo-arrow {
      color: #cbd5e1;
      font-size: 10px;
    }

    /* 语法与句型结构核心呈现区 */
    .grammar-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }
    .grammar-pattern-title {
      font-size: 12px;
      font-weight: bold;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pattern-tag {
      background: #e0f2fe;
      color: #0284c7;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-family: monospace;
      font-weight: bold;
    }
    .grammar-desc {
      font-size: 11px;
      color: #475569;
      line-height: 1.3;
    }
    .grammar-example {
      font-size: 11px;
      color: #059669;
      background: #ecfdf5;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
    }

    /* 第二行：笔顺 + 米字格描红 */
    .char-practice-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .char-badge {
      width: 50px;
      text-align: center;
      font-size: 14px;
      color: #1e293b;
      font-weight: bold;
      flex-shrink: 0;
    }
    .char-pinyin-small {
      color: #1890ff;
      font-size: 13px;
    }
    .btn-animate {
      padding: 2px 6px;
      font-size: 10px;
      background: #fa8c16;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin-top: 3px;
    }

    /* 米字格布局 */
    .grid-list {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .mi-grid {
      width: 42px;
      height: 42px;
      border: 1px solid #ff4d4f;
      position: relative;
      background:
        linear-gradient(to top right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px));
      background-size: 100% 100%;
    }

    /* 打印适配 */
    @media print {
      body { background: transparent; padding: 0; }
      .controls { display: none !important; }
      .sheet-page { box-shadow: none; width: 100%; margin: 0; padding: 0; }
      .btn-animate { display: none; }
      .word-trans { border: none; background: transparent; padding: 0; }
      .char-cognition-row { background: #fff !important; border: 1px solid #cbd5e1; }
      .char-card { border: 1px solid #94a3b8; }
    }
  </style>
</head>
<body>

  <!-- 控制工具栏 -->
  <div class="controls">
    <input type="text" id="textInput" value="太大了, 太阳, 高山, 森林" placeholder="输入词语、短语或句型，用逗号或空格隔开..." />
    
    <select id="langSelect">
      <option value="en">🇬🇧 英语 (English)</option>
      <option value="de">🇩🇪 德语 (Deutsch)</option>
      <option value="fr">🇫🇷 法语 (Français)</option>
      <option value="es">🇪🇸 西班牙语 (Español)</option>
      <option value="it">🇮🇹 意大利语 (Italiano)</option>
      <option value="pt">🇵🇹 葡萄牙语 (Português)</option>
      <option value="ru">🇷🇺 俄语 (Русский)</option>
      <option value="none">🚫 无翻译</option>
    </select>

    <button class="btn" onclick="generateSheet()">生成字帖</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 打印字帖</button>
  </div>

  <div class="sheet-page" id="sheetContainer"></div>

  <script>
    const { pinyin } = pinyinPro;

    // 汉字语法结构、句型用法及精美插图数据库
    const CHAR_GRAMMAR_DB = {
      '太': {
        pattern: '太 + 形容词 / 动词 + (了)',
        patternEn: 'Too / Extremely + Adj (Excessive degree)',
        meaning: '表示程度极高或过分（too / overly / extremely）。',
        example: '例：太大 (too big) / 太好 (too good) / 太贵了 (too expensive)',
        icon: `<svg viewBox="0 0 64 64"><polygon points="32,6 40,24 60,24 44,36 50,54 32,42 14,54 20,36 4,24 24,24" fill="#fa8c16"/><circle cx="32" cy="30" r="6" fill="#fff"/></svg>`,
        steps: [{ name: '甲骨', char: '大' }, { name: '金文', char: '太' }, { name: '小篆', char: '太' }, { name: '楷书', char: '太' }]
      },
      '大': {
        pattern: '大 + 名词 / 形容词作谓语',
        patternEn: 'Big / Large / Great',
        meaning: '表示体积、规模、数量或年龄超过一般。',
        example: '例：大山 (big mountain) / 大人 (adult) / 房子很大 (The house is big)',
        icon: `<svg viewBox="0 0 64 64"><rect x="10" y="10" width="44" height="44" rx="8" fill="#1890ff"/><path d="M18,32 L46,32 M32,18 L32,46" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>`,
        steps: [{ name: '甲骨', char: '大' }, { name: '金文', char: '大' }, { name: '小篆', char: '大' }, { name: '楷书', char: '大' }]
      },
      '小': {
        pattern: '小 + 名词 / 形容词作谓语',
        patternEn: 'Small / Little / Young',
        meaning: '表示体积、程度细小或幼年。',
        example: '例：小鸟 (little bird) / 小心 (be careful / mindfully) / 小雨 (light rain)',
        icon: `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="12" fill="#52c41a"/><circle cx="16" cy="40" r="6" fill="#8ce857"/><circle cx="48" cy="40" r="6" fill="#8ce857"/></svg>`,
        steps: [{ name: '甲骨', char: '小' }, { name: '金文', char: '小' }, { name: '小篆', char: '小' }, { name: '楷书', char: '小' }]
      },
      '日': {
        pattern: '名词：太阳 / 量词：天数 / 词缀',
        patternEn: 'Sun / Day / Date',
        meaning: '表示太阳、白昼或按日计算的时间单位。',
        example: '例：日光 (sunlight) / 日记 (diary) / 5月1日 (May 1st)',
        icon: `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="15" fill="#ff4d4f"/><g stroke="#fa8c16" stroke-width="3" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="58"/><line x1="6" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="58" y2="32"/><line x1="14" y1="14" x2="18" y2="18"/><line x1="46" y1="46" x2="50" y2="50"/><line x1="14" y1="50" x2="18" y2="46"/><line x1="46" y1="14" x2="50" y2="18"/></g></svg>`,
        steps: [{ name: '甲骨', char: '☉' }, { name: '金文', char: '⊙' }, { name: '小篆', char: '⾐' }, { name: '楷书', char: '日' }]
      },
      '月': {
        pattern: '名词：月亮 / 时间：月份',
        patternEn: 'Moon / Month',
        meaning: '指天体月球，或用作一年的十二分之一时间单位。',
        example: '例：月亮 (moon) / 月光 (moonlight) / 上个月 (last month)',
        icon: `<svg viewBox="0 0 64 64"><path d="M42,10 A22,22 0 1,0 42,54 A18,18 0 0,1 42,10 Z" fill="#faad14"/></svg>`,
        steps: [{ name: '甲骨', char: '☽' }, { name: '金文', char: '⺼' }, { name: '小篆', char: '月' }, { name: '楷书', char: '月' }]
      },
      '山': {
        pattern: '名词：山峰 / 偏旁部首',
        patternEn: 'Mountain / Hill',
        meaning: '指地面形成的高耸隆起部分。',
        example: '例：高山 (high mountain) / 爬山 (climb mountains) / 山水 (scenery)',
        icon: `<svg viewBox="0 0 64 64"><polygon points="32,14 14,50 50,50" fill="#389e0d"/><polygon points="46,24 32,50 60,50" fill="#237804"/><polygon points="18,28 6,50 30,50" fill="#52c41a"/></svg>`,
        steps: [{ name: '甲骨', char: 'ⵊ' }, { name: '金文', char: '⽭' }, { name: '小篆', char: '山' }, { name: '楷书', char: '山' }]
      },
      '水': {
        pattern: '名词：水流 / 偏旁(氵)构成液体',
        patternEn: 'Water / Liquid',
        meaning: '无色无味液体，一切生命的源泉。',
        example: '例：喝水 (drink water) / 水果 (fruit) / 溪水 (stream)',
        icon: `<svg viewBox="0 0 64 64"><path d="M10,38 Q20,28 32,38 T54,38 M10,48 Q20,38 32,48 T54,48" fill="none" stroke="#1890ff" stroke-width="5" stroke-linecap="round"/></svg>`,
        steps: [{ name: '甲骨', char: '川' }, { name: '金文', char: '水' }, { name: '小篆', char: '氺' }, { name: '楷书', char: '水' }]
      },
      '林': {
        pattern: '名词：树林 / 聚集处',
        patternEn: 'Woods / Forest',
        meaning: '成片的树木或同类人/事物的聚集。',
        example: '例：树林 (woods) / 竹林 (bamboo forest) / 碑林 (forest of steles)',
        icon: `<svg viewBox="0 0 64 64"><circle cx="22" cy="26" r="12" fill="#52c41a"/><rect x="19" y="34" width="6" height="20" fill="#873800"/><circle cx="42" cy="22" r="14" fill="#389e0d"/><rect x="39" y="32" width="6" height="22" fill="#873800"/></svg>`,
        steps: [{ name: '甲骨', char: '木木' }, { name: '金文', char: '林' }, { name: '小篆', char: '林' }, { name: '楷书', char: '林' }]
      },
      '森': {
        pattern: '名词：森林 / 形容词：茂盛森严',
        patternEn: 'Dense forest / Vast woods',
        meaning: '许多树木聚集生长成片的大面积区域。',
        example: '例：森林 (forest) / 阴森 (gloomy) / 森罗万象 (all-inclusive)',
        icon: `<svg viewBox="0 0 64 64"><circle cx="32" cy="18" r="10" fill="#237804"/><rect x="30" y="24" width="4" height="12" fill="#612500"/><circle cx="18" cy="38" r="10" fill="#52c41a"/><rect x="16" y="44" width="4" height="12" fill="#612500"/><circle cx="46" cy="38" r="10" fill="#389e0d"/><rect x="44" y="44" width="4" height="12" fill="#612500"/></svg>`,
        steps: [{ name: '金文', char: '森' }, { name: '小篆', char: '森' }, { name: '隶书', char: '森' }, { name: '楷书', char: '森' }]
      },
      '高': {
        pattern: '高 + 名词 / 程度形容词',
        patternEn: 'High / Tall / High level',
        meaning: '由下到上距离大；或等级、水平优越。',
        example: '例：高山 (high mountain) / 个子很高 (very tall) / 高水平 (high level)',
        icon: `<svg viewBox="0 0 64 64"><path d="M32,8 L48,22 L16,22 Z" fill="#fa8c16"/><rect x="22" y="22" width="20" height="34" fill="#d46b08"/><rect x="27" y="36" width="10" height="20" fill="#fff"/></svg>`,
        steps: [{ name: '甲骨', char: '高' }, { name: '金文', char: '高' }, { name: '小篆', char: '高' }, { name: '楷书', char: '高' }]
      }
    };

    // 常用短语精准备用库
    const PHRASE_DICT = {
      '太大了': { en: 'Too big / Extremely large', de: 'Viel zu groß', fr: 'Trop grand', es: 'Demasiado grande', it: 'Troppo grande', pt: 'Grande demais', ru: 'Слишком большой' },
      '太阳': { en: 'Sun', de: 'die Sonne', fr: 'le soleil', es: 'el sol', it: 'il sole', pt: 'o sol', ru: 'солнце' },
      '月亮': { en: 'Moon', de: 'der Mond', fr: 'la lune', es: 'la luna', it: 'la luna', pt: 'a lua', ru: 'луна' },
      '高山': { en: 'High mountain', de: 'hoher Berg', fr: 'haute montagne', es: 'alta montaña', it: 'alta montagna', pt: 'alta montanha', ru: 'высокая гора' },
      '森林': { en: 'Forest', de: 'der Wald', fr: 'la forêt', es: 'el bosque', it: 'la foresta', pt: 'a floresta', ru: 'лес' }
    };

    // 通用汉字回退解析
    function getDefaultGrammar(char) {
      return {
        pattern: `常用汉字：${char}`,
        patternEn: 'Basic Character',
        meaning: `请结合前后语境及词组进行理解运用。`,
        example: `例：${char}字 / 学${char}`,
        icon: `<svg viewBox="0 0 64 64"><rect x="12" y="12" width="40" height="40" rx="8" fill="#f1f5f9"/><text x="32" y="38" font-size="20" text-anchor="middle" fill="#64748b">${char}</text></svg>`,
        steps: [{ name: '古文', char: char }, { name: '小篆', char: char }, { name: '隶书', char: char }, { name: '楷书', char: char }]
      };
    }

    async function getPhraseTranslation(phrase, targetLang) {
      if (targetLang === 'none') return '';
      if (PHRASE_DICT[phrase] && PHRASE_DICT[phrase][targetLang]) {
        return PHRASE_DICT[phrase][targetLang];
      }
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(phrase)}&langpair=zh-CN|${targetLang}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data?.responseData?.translatedText) {
          const trans = data.responseData.translatedText.trim();
          if (!trans.startsWith('MYMEMORY WARNING')) return trans;
        }
      } catch (e) {
        console.warn('在线词组翻译失败:', e);
      }
      return '点击补充完整释义';
    }

    async function generateSheet() {
      const container = document.getElementById('sheetContainer');
      const text = document.getElementById('textInput').value.trim();
      const targetLang = document.getElementById('langSelect').value;
      container.innerHTML = '';

      const phrases = text.split(/[,，;；\n\s]+/).filter(item => item.trim().length > 0);
      if (phrases.length === 0) {
        alert('请输入有效的中文词语或句子！');
        return;
      }

      let globalGridIdx = 0;

      for (let pIdx = 0; pIdx < phrases.length; pIdx++) {
        const rawPhrase = phrases[pIdx];
        const chars = (rawPhrase.match(/[\u4e00-\u9fa5]/g) || []).join('');
        if (!chars) continue;

        const phrasePinyin = pinyin(chars, { toneType: 'symbol' });
        const transBoxId = `trans-box-${pIdx}`;

        const wordBlock = document.createElement('div');
        wordBlock.className = 'word-block';

        // 词条顶部头部
        wordBlock.innerHTML = `
          <div class="word-header">
            <span class="word-text">${chars}</span>
            <span class="word-pinyin">[ ${phrasePinyin} ]</span>
            <div class="word-trans" id="${transBoxId}" contenteditable="true" title="点击可编辑释义">${targetLang === 'none' ? '' : '翻译获取中...'}</div>
          </div>
        `;

        // 逐字生成语法解析与练习卡
        for (let cIdx = 0; cIdx < chars.length; cIdx++) {
          const char = chars[cIdx];
          const charPy = pinyin(char, { toneType: 'symbol' });
          const firstGridId = `grid-demo-${globalGridIdx}`;

          const charData = CHAR_GRAMMAR_DB[char] || getDefaultGrammar(char);
          const stepsHtml = charData.steps.map((s, idx) => `
            <div class="evo-step">
              <span class="evo-icon">${s.char}</span>
              <span class="evo-name">${s.name}</span>
            </div>
            ${idx < charData.steps.length - 1 ? '<span class="evo-arrow">→</span>' : ''}
          `).join('');

          const card = document.createElement('div');
          card.className = 'char-card';

          // 1. 图解 + 溯源 + 语法句型结构
          card.innerHTML = `
            <div class="char-cognition-row">
              <div class="pic-badge" title="${char} 的具象插图">${charData.icon}</div>
              <div class="evolution-box">
                <div class="evolution-timeline">${stepsHtml}</div>
              </div>
              <div class="grammar-box">
                <div class="grammar-pattern-title">
                  <span class="pattern-tag">${charData.pattern}</span>
                  <span style="font-size:11px; color:#64748b;">${charData.patternEn}</span>
                </div>
                <div class="grammar-desc">${charData.meaning}</div>
                <div class="grammar-example">${charData.example}</div>
              </div>
            </div>
          `;

          // 2. 笔顺与描红米字格
          const practiceRow = document.createElement('div');
          practiceRow.className = 'char-practice-row';

          const charBadge = document.createElement('div');
          charBadge.className = 'char-badge';
          charBadge.innerHTML = `
            <div class="char-pinyin-small">${charPy}</div>
            <button class="btn-animate" onclick="playStroke('${firstGridId}', '${char}')">▶ 笔顺</button>
          `;
          practiceRow.appendChild(charBadge);

          // 米字格（1示范 + 2描红 + 4练习）
          const gridList = document.createElement('div');
          gridList.className = 'grid-list';
          
          const totalGrids = 7;
          const currentGrids = [];
          for (let g = 0; g < totalGrids; g++) {
            const grid = document.createElement('div');
            grid.className = 'mi-grid';
            grid.id = (g === 0) ? firstGridId : `grid-${globalGridIdx}-${g}`;
            gridList.appendChild(grid);
            currentGrids.push(grid.id);
          }
          practiceRow.appendChild(gridList);
          card.appendChild(practiceRow);

          wordBlock.appendChild(card);
          container.appendChild(wordBlock);

          // 渲染黑字示范
          HanziWriter.create(firstGridId, char, {
            width: 42, height: 42, padding: 3, strokeColor: '#000000', showOutline: false
          });

          // 渲染描红浅灰字
          for (let g = 1; g <= 2; g++) {
            HanziWriter.create(currentGrids[g], char, {
              width: 42, height: 42, padding: 3, strokeColor: '#d4d4d4', showOutline: false
            });
          }

          globalGridIdx++;
        }

        // 异步填充整词完整翻译
        if (targetLang !== 'none') {
          getPhraseTranslation(chars, targetLang).then(res => {
            const transEl = document.getElementById(transBoxId);
            if (transEl) transEl.innerText = res;
          });
        }
      }
    }

    function playStroke(elementId, char) {
      const targetElem = document.getElementById(elementId);
      targetElem.innerHTML = '';
      const writer = HanziWriter.create(elementId, char, {
        width: 42, height: 42, padding: 3,
        strokeColor: '#1890ff',
        strokeAnimationSpeed: 1.2,
        delayBetweenStrokes: 120
      });
      writer.animateCharacter();
    }

    window.onload = generateSheet;
  </script>
</body>
</html>
