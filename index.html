<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多语言汉字源流演变与分步笔顺字帖系统</title>
  <!-- 引入汉字笔顺库与拼音库 -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.3/dist/index.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
    }

    /* 顶部控制栏 */
    .controls {
      background: #fff;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 1100px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .controls input {
      flex: 3;
      min-width: 280px;
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
    }
    .controls select {
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      background: #fff;
    }
    .btn {
      padding: 9px 18px;
      font-size: 15px;
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-print { background: #52c41a; }
    .btn:hover { opacity: 0.9; }

    /* A4 纸张排版容器 */
    .sheet-page {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 12mm 14mm;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    /* 词语/句型单元块 */
    .word-block {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px dashed #eaeaea;
    }

    /* 词条顶部：左侧词句拼音，右侧整词/句型解析条框 */
    .word-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 6px;
      border-left: 4px solid #1890ff;
    }
    
    /* 词语区：拼音在字正上方 */
    .word-meta-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      min-width: 140px;
    }
    .word-ruby-container {
      display: inline-flex;
      align-items: flex-end;
      gap: 4px;
    }
    ruby {
      ruby-align: center;
      ruby-position: over;
      font-size: 22px;
      font-weight: bold;
      color: #1e293b;
    }
    rt {
      font-size: 12px;
      font-weight: 600;
      color: #1890ff;
      line-height: 1.2;
    }
    .btn-audio {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      color: #096dd9;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .btn-audio:hover {
      background: #bae7ff;
    }

    /* 词语右侧条框 */
    .word-trans-box {
      flex: 1;
      background: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px dashed #cbd5e1;
      cursor: text;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12.5px;
    }
    .word-trans-box:focus {
      outline: 1px solid #1890ff;
      background: #f0fdf4;
    }
    .trans-meaning-line {
      color: #1e293b;
      font-weight: 600;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .hsk-tag {
      background: #ff4d4f;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 3px;
    }
    .engine-tag {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
      font-size: 9.5px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: normal;
    }
    .btn-foreign-audio {
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      color: #389e0d;
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 3px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 500;
    }
    .btn-foreign-audio:hover {
      background: #d9f7be;
    }
    .trans-usage-line {
      font-size: 11.5px;
      color: #0369a1;
      background: #f0f9ff;
      padding: 2px 6px;
      border-radius: 3px;
      line-height: 1.35;
      border-left: 3px solid #0ea5e9;
    }

    /* 单字卡片 */
    .char-card {
      margin-bottom: 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: nowrap;
      overflow-x: hidden;
    }

    /* 1. 最左边：单字拼音在正上方 + 按钮组 */
    .char-badge-left {
      width: 65px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .char-pinyin-top {
      color: #1890ff;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.2;
    }
    .btn-action-group {
      display: flex;
      gap: 3px;
      margin-top: 2px;
    }
    .btn-small-audio {
      padding: 1px 5px;
      font-size: 10px;
      background: #52c41a;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-animate {
      padding: 1px 5px;
      font-size: 10px;
      background: #fa8c16;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    /* 2. 中间：紧凑微型分步笔顺分解图 + 下方田字格练习区 */
    .middle-practice-zone {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    /* 紧凑型笔顺容器：尽量一行容纳，超长自动折成两行 */
    .stroke-steps-container {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap; /* 放不下时自适应折为两行 */
      max-width: 360px;
      padding: 1px 0;
    }
    .stroke-step-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    /* 微型分步格（18px 紧凑设计） */
    .step-grid-box {
      width: 18px;
      height: 18px;
      border: 1px solid #38bdf8;
      border-radius: 2px;
      position: relative;
      background:
        linear-gradient(to top right, transparent calc(50% - 0.5px), #f0f9ff 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #f0f9ff 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #f0f9ff 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #f0f9ff 50%, transparent calc(50% + 0.5px));
      background-size: 100% 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fff;
    }
    .step-grid-box svg {
      width: 15px;
      height: 15px;
    }
    .step-label {
      font-size: 7px;
      color: #0369a1;
      line-height: 1;
      transform: scale(0.8);
      white-space: nowrap;
    }

    .grid-list-middle {
      display: flex;
      gap: 5px;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }
    .mi-grid {
      width: 38px;
      height: 38px;
      border: 1px solid #ff4d4f;
      position: relative;
      background:
        linear-gradient(to top right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px));
      background-size: 100% 100%;
    }

    /* 3. 最右边：汉字源流演变 */
    .char-right-zone {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      flex-shrink: 0;
    }
    .font-evolution-container {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #f8fafc;
      border: 1px solid #edf2f7;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .ancient-link-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #334155;
      width: 36px;
      height: 40px;
      transition: all 0.2s;
    }
    .ancient-link-badge:hover {
      background: #e6f7ff;
      border-radius: 4px;
    }
    .ancient-glyph {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-family: "KaiTi", "STKaiti", "FangSong", serif;
    }
    .ancient-glyph svg {
      width: 20px;
      height: 20px;
      fill: #334155;
    }
    .ancient-label {
      font-size: 8.5px;
      color: #8c8c8c;
      transform: scale(0.85);
      margin-top: 1px;
    }
    .evo-arrow {
      color: #cbd5e1;
      font-size: 10px;
    }

    /* 打印适配 */
    @media print {
      body { background: transparent; padding: 0; }
      .controls { display: none !important; }
      .sheet-page { box-shadow: none; width: 100%; margin: 0; padding: 0; }
      .btn-animate, .btn-audio, .btn-small-audio, .btn-foreign-audio { display: none !important; }
      .word-trans-box { border: none; background: transparent; padding: 0; }
      .char-card { border: 1px solid #94a3b8; }
    }
  </style>
</head>
<body>

  <!-- 控制工具栏 -->
  <div class="controls">
    <input type="text" id="textInput" value="十, 上下, 牛马, 行, 快乐, 睡觉, 中国银行" placeholder="输入任意词语或句子，田字格上方将自动生成紧凑分步笔顺图..." />
    
    <select id="langSelect" onchange="generateSheet()">
      <option value="de">🇩🇪 德语 (Deutsch)</option>
      <option value="en">🇬🇧 英语 (English)</option>
      <option value="es">🇪🇸 西班牙语 (Español)</option>
      <option value="fr">🇫🇷 法语 (Français)</option>
      <option value="it">🇮🇹 意大利语 (Italiano)</option>
      <option value="pt">🇵🇹 葡萄牙语 (Português)</option>
      <option value="ru">🇷🇺 俄语 (Русский)</option>
      <option value="none">🚫 无翻译</option>
    </select>

    <button class="btn" onclick="generateSheet()">生成字帖</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 打印字帖</button>
  </div>

  <div class="sheet-page" id="sheetContainer"></div>

  <script>
    const { pinyin } = pinyinPro;

    const LANG_TTS_MAP = {
      de: 'de-DE',
      en: 'en-US',
      es: 'es-ES',
      fr: 'fr-FR',
      it: 'it-IT',
      pt: 'pt-PT',
      ru: 'ru-RU'
    };

    let cachedVoices = [];
    function loadVoices() {
      if ('speechSynthesis' in window) {
        cachedVoices = window.speechSynthesis.getVoices();
      }
    }
    loadVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 1. 标准汉字笔画名称库
    const CHAR_STROKES_DB = {
      '十': ['横', '竖'],
      '一': ['横'],
      '二': ['横', '横'],
      '三': ['横', '横', '横'],
      '上': ['竖', '横', '横'],
      '下': ['横', '竖', '点'],
      '牛': ['撇', '横', '横', '竖'],
      '马': ['横折', '竖折折钩', '横'],
      '车': ['横', '撇折', '横', '竖'],
      '日': ['竖', '横折', '横', '横'],
      '月': ['撇', '横折钩', '横', '横'],
      '山': ['竖', '竖折', '竖'],
      '水': ['竖钩', '横撇', '撇', '捺'],
      '人': ['撇', '捺'],
      '大': ['横', '撇', '捺'],
      '太': ['横', '撇', '捺', '点'],
      '小': ['竖钩', '撇', '点'],
      '中': ['竖', '横折', '横', '竖'],
      '国': ['竖', '横折', '横', '横', '竖', '横', '点', '横'],
      '行': ['撇', '撇', '竖', '横', '横', '竖钩'],
      '快': ['点', '点', '竖', '横折', '横', '撇', '捺'],
      '乐': ['撇', '竖折', '竖', '撇', '点'],
      '睡': ['竖', '横折', '横', '横', '横', '撇', '横', '竖', '横', '竖', '点', '撇', '横'],
      '觉': ['点', '点', '撇', '点', '横撇', '竖', '横折', '横', '竖弯钩']
    };

    function inferStrokeNameFromSvgPath(pathStr) {
      if (!pathStr) return '横';
      const points = pathStr.match(/[-+]?[0-9]*\.?[0-9]+/g);
      if (!points || points.length < 4) return '点';

      const x1 = parseFloat(points[0]), y1 = parseFloat(points[1]);
      const x2 = parseFloat(points[points.length - 2]), y2 = parseFloat(points[points.length - 1]);
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.sqrt(dx * dx + dy * dy);

      if (len < 180) return '点';

      const angle = Math.atan2(dy, dx) * 180 / Math.PI;

      if (angle >= -25 && angle <= 25) return '横';
      if (angle >= 65 && angle <= 115) return '竖';
      if (angle > 115 && angle <= 165) return '撇';
      if (angle > 25 && angle < 65) return '捺';
      if (pathStr.includes('C') || pathStr.includes('Q')) {
        if (dy > 0 && dx > 0) return '竖折';
        if (dy > 0 && dx < 0) return '撇折';
        return '横折';
      }
      if (angle < -25 && angle > -75) return '提';
      return '横';
    }

    // 2. 紧凑型 StrokeOrder 分步笔画分解图（微型紧凑，自适应一行/双行）
    async function renderCompactStrokeSteps(char, targetElemId) {
      const container = document.getElementById(targetElemId);
      if (!container) return;

      try {
        const charData = await HanziWriter.loadCharacterData(char);
        if (!charData || !charData.strokes || charData.strokes.length === 0) return;

        const totalStrokes = charData.strokes.length;
        const strokeNames = CHAR_STROKES_DB[char] || charData.strokes.map(s => inferStrokeNameFromSvgPath(s));
        
        let stepsHtml = '';

        for (let i = 0; i < totalStrokes; i++) {
          let pathsHtml = '';

          // 1. 浅灰底模（尚未书写的后续笔画）
          for (let bg = 0; bg < totalStrokes; bg++) {
            pathsHtml += `<path d="${charData.strokes[bg]}" fill="#e2e8f0" transform="scale(0.018, -0.018) translate(0, -900)"/>`;
          }

          // 2. 前序已写好的笔画（黑色）
          for (let prev = 0; prev < i; prev++) {
            pathsHtml += `<path d="${charData.strokes[prev]}" fill="#262626" transform="scale(0.018, -0.018) translate(0, -900)"/>`;
          }

          // 3. 当前步骤正在书写的笔画（红色高亮）
          pathsHtml += `<path d="${charData.strokes[i]}" fill="#ff4d4f" transform="scale(0.018, -0.018) translate(0, -900)"/>`;

          const strokeName = strokeNames[i] || `${i+1}`;

          stepsHtml += `
            <div class="stroke-step-card" title="第 ${i+1} 步: ${strokeName}">
              <div class="step-grid-box">
                <svg viewBox="0 0 18 18">${pathsHtml}</svg>
              </div>
              <div class="step-label">${strokeName}</div>
            </div>
          `;
        }

        container.innerHTML = stepsHtml;
      } catch (e) {
        console.warn(`分步笔顺渲染异常 [${char}]:`, e);
      }
    }

    // 3. 德语名词全量正字法大写处理
    function universalGermanCapitalize(rawText) {
      if (!rawText) return '';

      const germanArticles = new Set([
        'der', 'die', 'das', 'den', 'dem', 'des', 'ein', 'eine', 'einen', 'einem', 'einer', 'eines'
      ]);
      const germanPrepositions = new Set([
        'in', 'ins', 'im', 'an', 'am', 'ans', 'auf', 'aufs', 'aus', 'bei', 'beim', 'mit', 'nach', 'von', 'vom', 'zu', 'zum', 'zur', 'für', 'fürs', 'um', 'ums', 'über', 'unter', 'vor', 'hinter', 'neben', 'zwischen', 'durch'
      ]);
      const germanConjunctions = new Set([
        'und', 'oder', 'aber', 'denn', 'doch', 'als', 'wie'
      ]);
      const nounSuffixes = [
        'ung', 'heit', 'keit', 'schaft', 'tion', 'sion', 'tät', 'tum', 'ment', 'chen', 'lein', 'ling', 'nis', 'ant', 'ent', 'ist', 'or', 'eur', 'enz', 'anz'
      ];

      const entries = rawText.split(/([\/;])/);

      return entries.map(part => {
        if (part === '/' || part === ';') return part;

        let str = part.trim();
        if (!str) return '';

        const tokens = str.split(/\s+/);
        const len = tokens.length;

        const capitalizedTokens = tokens.map((tok, idx) => {
          const clean = tok.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
          const lower = clean.toLowerCase();

          if (!clean) return tok;

          if (germanArticles.has(lower) || germanPrepositions.has(lower) || germanConjunctions.has(lower)) {
            return tok.toLowerCase();
          }

          if (idx > 0) {
            const prev = tokens[idx - 1].toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
            if (germanArticles.has(prev) || germanPrepositions.has(prev)) {
              return tok.charAt(0).toUpperCase() + tok.slice(1);
            }
          }

          const hasNounSuffix = nounSuffixes.some(suf => lower.length > suf.length + 2 && lower.endsWith(suf));
          if (hasNounSuffix) {
            return tok.charAt(0).toUpperCase() + tok.slice(1);
          }

          if (idx === len - 1 && len <= 3 && !lower.endsWith('en') && !lower.endsWith('ern') && !lower.endsWith('eln')) {
            return tok.charAt(0).toUpperCase() + tok.slice(1);
          }

          if (len === 1 && !lower.endsWith('en') && !lower.endsWith('lich') && !lower.endsWith('ig') && !lower.endsWith('isch')) {
            return tok.charAt(0).toUpperCase() + tok.slice(1);
          }

          return tok;
        });

        if (capitalizedTokens.length > 0) {
          const firstLower = capitalizedTokens[0].toLowerCase();
          if (!germanArticles.has(firstLower) && !germanPrepositions.has(firstLower)) {
            capitalizedTokens[0] = capitalizedTokens[0].charAt(0).toUpperCase() + capitalizedTokens[0].slice(1);
          }
        }

        return capitalizedTokens.join(' ');
      }).join('');
    }

    // 4. 权威汉字源流演变古文字库
    const CHAR_EVOLUTION_DB = {
      '十': [
        { name: '甲骨', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M50,15 L50,85" stroke="#334155" stroke-width="8" fill="none"/></svg>` },
        { name: '金文', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M50,15 L50,85 M50,50 C40,50 40,60 50,60 C60,60 60,50 50,50 Z" stroke="#334155" stroke-width="7" fill="#334155"/></svg>` },
        { name: '小篆', type: 'text', content: '十' }
      ],
      '上': [
        { name: '甲骨', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M20,75 L80,75 M50,75 L50,25 M35,45 L65,45" stroke="#334155" stroke-width="8" fill="none"/></svg>` },
        { name: '金文', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M20,75 L80,75 M50,75 L50,25" stroke="#334155" stroke-width="8" fill="none"/></svg>` },
        { name: '小篆', type: 'text', content: '上' }
      ],
      '下': [
        { name: '甲骨', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M20,25 L80,25 M50,25 L50,75 M35,55 L65,55" stroke="#334155" stroke-width="8" fill="none"/></svg>` },
        { name: '金文', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M20,25 L80,25 M50,25 L50,75" stroke="#334155" stroke-width="8" fill="none"/></svg>` },
        { name: '小篆', type: 'text', content: '下' }
      ],
      '牛': [

    // 5. 多音字语境识别
    function getContextualPinyinList(phrase) {
      return pinyin(phrase, { toneType: 'symbol', type: 'array' });
    }

    const POLYPHONE_SPEECH_MAP = {
      '行': { 'háng': '航', 'xíng': '形' },
      '觉': { 'jiào': '叫', 'jué': '决' },
      '乐': { 'yuè': '月', 'lè': '勒' },
      '重': { 'zhòng': '众', 'chóng': '虫' },
      '数': { 'shù': '树', 'shǔ': '暑' },
      '发': { 'fā': '八', 'fà': '法' },
      '地': { 'de': '的', 'dì': '弟' },
      '长': { 'cháng': '常', 'zhǎng': '掌' },
      '得': { 'dé': '德', 'de': '的', 'děi': '待' },
      '着': { 'zhe': '者', 'zháo': '找', 'zhuó': '卓' }
    };

    function speakCharWithPinyin(char, py) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      let spokenText = char;
      if (POLYPHONE_SPEECH_MAP[char]) {
        for (let targetPy in POLYPHONE_SPEECH_MAP[char]) {
          if (py.includes(targetPy) || pinyin(char, { toneType: 'none' }) === targetPy) {
            spokenText = POLYPHONE_SPEECH_MAP[char][targetPy];
            break;
          }
        }
      }

      const utterance = new SpeechSynthesisUtterance(spokenText);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.85;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.85;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    let activeAudioPlayer = null;
    function speakForeignTextSafe(encodedText, targetLang) {
      if (!encodedText || targetLang === 'none') return;
      
      const rawText = decodeURIComponent(encodedText);
      let cleanText = rawText.replace(/^\d+\.\s*/, '').split(/[\/;,\(]/)[0].trim();
      if (!cleanText) cleanText = rawText;

      const langCode = LANG_TTS_MAP[targetLang] || 'en-US';

      if (activeAudioPlayer) {
        activeAudioPlayer.pause();
        activeAudioPlayer = null;
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = langCode;
        utterance.rate = 0.9;
        utterance.pitch = 1.0;

        const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
        const bestVoice = voices.find(v => (v.lang === langCode || v.lang.startsWith(targetLang)) && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Premium') || v.name.includes('Siri'))) 
                       || voices.find(v => v.lang === langCode || v.lang.startsWith(targetLang));

        if (bestVoice) utterance.voice = bestVoice;

        let hasSpoken = false;
        utterance.onstart = () => { hasSpoken = true; };

        setTimeout(() => {
          if (!hasSpoken && !window.speechSynthesis.speaking) {
            playGoogleTtsAudio(cleanText, targetLang);
          }
        }, 250);

        try {
          window.speechSynthesis.speak(utterance);
          return;
        } catch (err) {
          console.warn('本地语音合成异常:', err);
        }
      }

      playGoogleTtsAudio(cleanText, targetLang);
    }

    function playGoogleTtsAudio(text, targetLang) {
      try {
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${targetLang}&q=${encodeURIComponent(text)}`;
        activeAudioPlayer = new Audio(ttsUrl);
        activeAudioPlayer.play().catch(e => console.warn('在线 TTS 受限:', e));
      } catch (e) {
        console.error('音频引擎初始化异常:', e);
      }
    }

    // 6. Google AI 多义项深度解析引擎
    async function fetchGoogleMultiMeanings(text, targetLang) {
      if (targetLang === 'none' || !text) return null;

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=${targetLang}&dt=t&dt=bd&dt=ss&dt=md&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        
        let primaryTranslation = '';
        if (data && data[0]) {
          primaryTranslation = data[0].map(item => item[0]).filter(Boolean).join('').trim();
        }

        const distinctMeanings = [];
        const seenSet = new Set();

        function addCandidate(cand) {
          if (!cand) return;
          let str = cand.trim();
          let key = str.toLowerCase();
          if (!seenSet.has(key) && key.length > 0 && !key.includes('http')) {
            seenSet.add(key);
            distinctMeanings.push(str);
          }
        }

        if (primaryTranslation) addCandidate(primaryTranslation);

        if (data && Array.isArray(data[1])) {
          data[1].forEach(posBlock => {
            if (Array.isArray(posBlock[1])) {
              posBlock[1].forEach(item => {
                if (typeof item === 'string') addCandidate(item);
              });
            }
          });
        }

        if (data && Array.isArray(data[11])) {
          data[11].forEach(synBlock => {
            if (Array.isArray(synBlock[1])) {
              synBlock[1].forEach(synList => {
                if (Array.isArray(synList[0])) {
                  synList[0].forEach(word => addCandidate(word));
                }
              });
            }
          });
        }

        let topMeanings = distinctMeanings.slice(0, 3);
        if (topMeanings.length === 0 && primaryTranslation) {
          topMeanings = [primaryTranslation];
        }

        if (targetLang === 'de') {
          topMeanings = topMeanings.map(m => universalGermanCapitalize(m));
          primaryTranslation = universalGermanCapitalize(primaryTranslation);
        }

        let formattedString = '';
        if (topMeanings.length > 1) {
          formattedString = topMeanings.map((m, i) => `${i + 1}. ${m}`).join('   ');
        } else if (topMeanings.length === 1) {
          formattedString = topMeanings[0];
        }

        return {
          meaning: formattedString,
          primary: topMeanings[0] || primaryTranslation || ''
        };
      } catch (e) {
        console.warn('Google 多义项调度异常:', e);
      }
      return null;
    }

    // 7. 通用多语言与语法解析入口
    async function getUniversalPhraseDetails(phrase, targetLang) {
      if (targetLang === 'none' || !phrase) {
        return { hsk: '', meaning: '', usage: '', primary: '' };
      }

      let meaningResult = '释义获取中...';
      let primaryWord = '';

      const googleRes = await fetchGoogleMultiMeanings(phrase, targetLang);
      if (googleRes && googleRes.meaning) {
        meaningResult = googleRes.meaning;
        primaryWord = googleRes.primary;
      } else {
        meaningResult = '点击补充词语释义';
      }

      let dynamicUsage = '';
      if (phrase.startsWith('太') && phrase.endsWith('了')) {
        dynamicUsage = `太 + Adj + 了 ➔ (Exclamatory / Degree Pattern)`;
      } else if (phrase.includes('不') || phrase.includes('没')) {
        dynamicUsage = `不 / 没 + Verb / Adj ➔ (Negation)`;
      }

      return {
        hsk: 'HSK',
        meaning: meaningResult,
        usage: dynamicUsage,
        primary: primaryWord
      };
    }

    // 8. 获取汉字权威演变数据
    function getCharEvolutionData(char) {
      if (CHAR_EVOLUTION_DB[char]) {
        return CHAR_EVOLUTION_DB[char];
      }
      return null;
    }

    // 9. 生成字帖核心函数
    async function generateSheet() {
      const container = document.getElementById('sheetContainer');
      const text = document.getElementById('textInput').value.trim();
      const targetLang = document.getElementById('langSelect').value;
      container.innerHTML = '';

      const phrases = text.split(/[,，;；\n\s]+/).filter(item => item.trim().length > 0);
      if (phrases.length === 0) {
        alert('请输入有效的中文词语或句子！');
        return;
      }

      let globalGridIdx = 0;

      for (let pIdx = 0; pIdx < phrases.length; pIdx++) {
        const rawPhrase = phrases[pIdx];
        const chars = (rawPhrase.match(/[\u4e00-\u9fa5]/g) || []).join('');
        if (!chars) continue;

        const contextualPinyins = getContextualPinyinList(chars);
        
        const rubyHtml = chars.split('').map((char, i) => `
          <ruby>${char}<rt>${contextualPinyins[i] || ''}</rt></ruby>
        `).join('');
        
        const transMeaningId = `trans-meaning-${pIdx}`;
        const transUsageId = `trans-usage-${pIdx}`;

        const wordBlock = document.createElement('div');
        wordBlock.className = 'word-block';

        wordBlock.innerHTML = `
          <div class="word-header">
            <div class="word-meta-left">
              <div class="word-ruby-container">${rubyHtml}</div>
              <button class="btn-audio" onclick="speakText('${chars}')">🔊 朗读中文</button>
            </div>
            <div class="word-trans-box" contenteditable="true" title="点击可直接编辑修改词语多重释义与语法">
              <div class="trans-meaning-line" id="${transMeaningId}">
                <span>${targetLang === 'none' ? '' : 'Google AI 多义项解析中...'}</span>
              </div>
              <div class="trans-usage-line" id="${transUsageId}" style="display:none;"></div>
            </div>
          </div>
        `;

        // 逐字生成字卡：左(拼音在上方/发音/笔顺) ➔ 中(紧凑分步笔顺图 + 田字格) ➔ 右(权威汉字演变)
        for (let cIdx = 0; cIdx < chars.length; cIdx++) {
          const char = chars[cIdx];
          const charPy = contextualPinyins[cIdx] || pinyin(char, { toneType: 'symbol' });
          const firstGridId = `grid-demo-${globalGridIdx}`;
          const strokeStepsId = `stroke-steps-${globalGridIdx}`;

          const evoList = getCharEvolutionData(char);

          let evolutionHtml = '';
          if (evoList && evoList.length > 0) {
            const evoNodesHtml = evoList.map((node, idx) => `
              <a class="ancient-link-badge" href="https://www.chinese-linguipedia.org/search_source.html?word=${encodeURIComponent(char)}" target="_blank" title="在中华语文知识库/象形字典/说文解字查看「${char}」的${node.name}原图考据">
                <div class="ancient-glyph">${node.type === 'svg' ? node.content : node.content}</div>
                <div class="ancient-label">${node.name}</div>
              </a>
              ${idx < evoList.length - 1 ? '<span class="evo-arrow">→</span>' : ''}
            `).join('');

            evolutionHtml = `<div class="font-evolution-container">${evoNodesHtml}</div>`;
          }

          const card = document.createElement('div');
          card.className = 'char-card';

          card.innerHTML = `
            <!-- 1. 最左边：单字拼音在正上方 + 纠偏朗读与笔顺按钮 -->
            <div class="char-badge-left">
              <div class="char-pinyin-top">${charPy}</div>
              <div class="btn-action-group">
                <button class="btn-small-audio" onclick="speakCharWithPinyin('${char}', '${charPy}')" title="按当前语境拼音朗读该字">🔊</button>
                <button class="btn-animate" onclick="playStroke('${firstGridId}', '${char}')" title="播放笔顺动画">▶ 笔顺</button>
              </div>
            </div>

            <!-- 2. 中间：紧凑型分步笔顺拆解图 (放不下时自适应折为两行) + 下方田字格练习区 -->
            <div class="middle-practice-zone">
              <div class="stroke-steps-container" id="${strokeStepsId}" title="StrokeOrder 紧凑分步笔顺图">
                <span style="font-size:9px; color:#94a3b8;">笔顺分解中...</span>
              </div>
              <div class="grid-list-middle" id="grid-list-${globalGridIdx}"></div>
            </div>

            <!-- 3. 最右边：汉字源流演变 -->
            <div class="char-right-zone">
              ${evolutionHtml}
            </div>
          `;

          const gridList = card.querySelector(`#grid-list-${globalGridIdx}`);
          const totalGrids = 8;
          const currentGrids = [];
          for (let g = 0; g < totalGrids; g++) {
            const grid = document.createElement('div');
            grid.className = 'mi-grid';
            grid.id = (g === 0) ? firstGridId : `grid-${globalGridIdx}-${g}`;
            gridList.appendChild(grid);
            currentGrids.push(grid.id);
          }

          wordBlock.appendChild(card);
          container.appendChild(wordBlock);

          // 渲染微型紧凑分步笔顺分解图（18px，前序黑色+当前红色+后续浅灰，自适应折行）
          renderCompactStrokeSteps(char, strokeStepsId);

          HanziWriter.create(firstGridId, char, {
            width: 38, height: 38, padding: 2, strokeColor: '#000000', showOutline: false
          });

          for (let g = 1; g <= 2; g++) {
            HanziWriter.create(currentGrids[g], char, {
              width: 38, height: 38, padding: 2, strokeColor: '#d4d4d4', showOutline: false
            });
          }

          globalGridIdx++;
        }

        if (targetLang !== 'none') {
          getUniversalPhraseDetails(chars, targetLang).then(res => {
            const mEl = document.getElementById(transMeaningId);
            const uEl = document.getElementById(transUsageId);
            
            const safeSpeakParam = encodeURIComponent(res.primary || res.meaning);

            if (mEl) {
              mEl.innerHTML = `
                <span class="hsk-tag">${res.hsk}</span>
                <span class="engine-tag">Google AI</span>
                <span>${res.meaning}</span>
                <button class="btn-foreign-audio" onclick="speakForeignTextSafe('${safeSpeakParam}', '${targetLang}')">🔊 朗读翻译</button>
              `;
            }
            if (uEl) {
              if (res.usage) {
                uEl.style.display = 'block';
                uEl.innerText = res.usage;
              } else {
                uEl.style.display = 'none';
              }
            }
          });
        }
      }
    }

    function playStroke(elementId, char) {
      const targetElem = document.getElementById(elementId);
      targetElem.innerHTML = '';
      const writer = HanziWriter.create(elementId, char, {
        width: 38, height: 38, padding: 2,
        strokeColor: '#1890ff',
        strokeAnimationSpeed: 1.2,
        delayBetweenStrokes: 120
      });
      writer.animateCharacter();
    }

    window.onload = generateSheet;
  </script>
