<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通用多语言汉字演变与词语语法字帖系统</title>
  <!-- 引入汉字笔顺库与拼音库 -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.3/dist/index.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
    }

    /* 顶部控制栏 */
    .controls {
      background: #fff;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 1060px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .controls input {
      flex: 3;
      min-width: 280px;
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
    }
    .controls select {
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      background: #fff;
    }
    .btn {
      padding: 9px 18px;
      font-size: 15px;
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-print { background: #52c41a; }
    .btn:hover { opacity: 0.9; }

    /* A4 纸张排版容器 */
    .sheet-page {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 12mm 15mm;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    /* 词语单元块 */
    .word-block {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px dashed #eaeaea;
    }

    /* 词条顶部：左侧拼音语音，右侧整词释义与用法条框 */
    .word-header {
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 12px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 6px;
      border-left: 4px solid #1890ff;
    }
    .word-meta-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-width: 140px;
    }
    .word-text-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .word-text {
      font-size: 20px;
      font-weight: bold;
      color: #1e293b;
    }
    .btn-audio {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      color: #096dd9;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .word-pinyin {
      font-size: 14px;
      color: #1890ff;
      font-weight: 600;
    }

    /* 词语右侧条框：多重释义 + 语法句型用法 */
    .word-trans-box {
      flex: 1;
      background: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px dashed #cbd5e1;
      cursor: text;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 13px;
    }
    .word-trans-box:focus {
      outline: 1px solid #1890ff;
      background: #f0fdf4;
    }
    .trans-meaning-line {
      color: #1e293b;
      font-weight: 500;
      line-height: 1.4;
    }
    .trans-usage-line {
      font-size: 12px;
      color: #0284c7;
      background: #f0f9ff;
      padding: 2px 6px;
      border-radius: 3px;
      width: fit-content;
      line-height: 1.35;
    }

    /* 单字卡片：无单字释义，仅字源、插图、拼音与描红 */
    .char-card {
      margin-bottom: 10px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* 左侧：配图 + 字源网演变 (hanziyuan) */
    .char-left-zone {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pic-badge {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .pic-badge svg {
      width: 38px;
      height: 38px;
    }

    /* 汉字字源演变区 (甲骨文 -> 金文 -> 小篆 -> 楷书) */
    .etymology-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      border: 1px solid #edf2f7;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .evo-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 32px;
      text-decoration: none;
    }
    .evo-glyph {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .evo-glyph svg {
      width: 24px;
      height: 24px;
      fill: #334155;
    }
    .evo-glyph-text {
      font-size: 17px;
      font-family: "KaiTi", "STKaiti", "FangSong", serif;
      color: #334155;
    }
    .evo-label {
      font-size: 9px;
      color: #64748b;
      margin-top: 1px;
      transform: scale(0.9);
    }
    .evo-arrow {
      color: #cbd5e1;
      font-size: 11px;
    }

    /* 中间：单字多音字发音 + 控制 */
    .char-badge {
      width: 60px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .char-pinyin-small {
      color: #1890ff;
      font-size: 14px;
      font-weight: bold;
    }
    .btn-action-group {
      display: flex;
      gap: 3px;
    }
    .btn-small-audio {
      padding: 2px 5px;
      font-size: 10px;
      background: #52c41a;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-animate {
      padding: 2px 5px;
      font-size: 10px;
      background: #fa8c16;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    /* 右侧：米字格描红 */
    .grid-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mi-grid {
      width: 42px;
      height: 42px;
      border: 1px solid #ff4d4f;
      position: relative;
      background:
        linear-gradient(to top right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px));
      background-size: 100% 100%;
    }

    /* 打印适配 */
    @media print {
      body { background: transparent; padding: 0; }
      .controls { display: none !important; }
      .sheet-page { box-shadow: none; width: 100%; margin: 0; padding: 0; }
      .btn-animate, .btn-audio, .btn-small-audio { display: none !important; }
      .word-trans-box { border: none; background: transparent; padding: 0; }
      .char-card { border: 1px solid #94a3b8; }
    }
  </style>
</head>
<body>

  <!-- 控制工具栏 -->
  <div class="controls">
    <input type="text" id="textInput" value="车马, 太大了, 中国银行, 去看电影, 觉得" placeholder="输入任意词语或短句（字源演变依 hanziyuan 标准呈现）..." />
    
    <select id="langSelect" onchange="generateSheet()">
      <option value="de">🇩🇪 德语 (Deutsch)</option>
      <option value="en">🇬🇧 英语 (English)</option>
      <option value="es">🇪🇸 西班牙语 (Español)</option>
      <option value="fr">🇫🇷 法语 (Français)</option>
      <option value="it">🇮🇹 意大利语 (Italiano)</option>
      <option value="pt">🇵🇹 葡萄牙语 (Português)</option>
      <option value="ru">🇷🇺 俄语 (Русский)</option>
      <option value="none">🚫 无翻译</option>
    </select>

    <button class="btn" onclick="generateSheet()">生成字帖</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 打印字帖</button>
  </div>

  <div class="sheet-page" id="sheetContainer"></div>

  <script>
    const { pinyin } = pinyinPro;

    // 1. 基于字源网 (hanziyuan.net) 标准的真实字源拓片字形与象形矢量库
    const ETYMOLOGY_HANZIYUAN_DB = {
      '车': {
        icon: `<svg viewBox="0 0 64 64"><rect x="14" y="24" width="36" height="16" rx="2" fill="#8c8c8c"/><circle cx="20" cy="46" r="8" fill="#1890ff"/><circle cx="44" cy="46" r="8" fill="#1890ff"/><path d="M8,32 L56,32" stroke="#595959" stroke-width="4"/></svg>`,
        nodes: [
          { name: '甲骨', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M50,10 L50,90 M20,20 L80,20 M20,80 L80,80 M20,20 L20,80 M80,20 L80,80 M35,40 L65,40 L65,60 L35,60 Z" stroke="#334155" stroke-width="6" fill="none"/></svg>` },
          { name: '金文', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M50,10 L50,90 M25,25 L75,25 M25,75 L75,75 M35,38 L65,38 L65,62 L35,62 Z M25,25 L25,75 M75,25 L75,75" stroke="#334155" stroke-width="6" fill="none"/></svg>` },
          { name: '小篆', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M50,10 L50,90 M20,30 Q50,22 80,30 M30,42 L70,42 L70,58 L30,58 Z M20,70 Q50,78 80,70" stroke="#334155" stroke-width="6" fill="none"/></svg>` },

        nodes: [
          { name: '甲骨', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M40,15 Q60,15 65,30 Q65,50 45,55 L45,85 M55,55 L65,85 M35,30 Q20,35 25,50 M65,30 L80,25 M65,38 L82,35 M65,46 L80,45" stroke="#334155" stroke-width="6" fill="none"/></svg>` },
          { name: '金文', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M40,15 Q65,15 65,35 Q65,55 45,60 L45,85 M55,60 L65,85 M30,35 Q20,40 25,55 M65,30 L80,25 M65,40 L82,38" stroke="#334155" stroke-width="6" fill="none"/></svg>` },
          { name: '小篆', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M35,15 L35,85 M35,25 Q65,20 65,45 Q65,65 35,65 M65,45 L80,42 M48,65 L48,85 M60,65 L60,85" stroke="#334155" stroke-width="6" fill="none"/></svg>` },
          { name: '楷书', type: 'text', content: '马' }

      '太': {
        icon: `<svg viewBox="0 0 64 64"><polygon points="32,8 40,24 58,24 44,36 50,54 32,42 14,54 20,36 6,24 24,24" fill="#fa8c16"/><circle cx="32" cy="30" r="5" fill="#fff"/></svg>`,
        nodes: [
          { name: '甲骨', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M50,15 L50,85 M20,45 Q50,40 80,45 M50,55 L25,85 M50,55 L75,85" stroke="#334155" stroke-width="8" fill="none" stroke-linecap="round"/></svg>` },
          { name: '金文', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M50,15 L50,85 M20,40 Q50,45 80,40 M50,55 L25,85 M50,55 L75,85 M50,68 C45,68 45,78 50,78 C55,78 55,68 50,68 Z" stroke="#334155" stroke-width="7" fill="#334155"/></svg>` },
          { name: '小篆', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M50,12 L50,60 M18,42 Q50,30 82,42 M50,60 Q30,75 22,88 M50,60 Q70,75 78,88 M42,75 Q50,82 58,75" stroke="#334155" stroke-width="7" fill="none"/></svg>` },
          { name: '楷书', type: 'text', content: '太' }
        ]
      },
      '大': {
        icon: `<svg viewBox="0 0 64 64"><rect x="8" y="8" width="48" height="48" rx="8" fill="#1890ff"/><path d="M16,32 L48,32 M32,16 L32,48" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>`,
        nodes: [
          { name: '甲骨', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M50,15 L50,85 M20,42 Q50,38 80,42 M50,55 L25,85 M50,55 L75,85" stroke="#334155" stroke-width="8" fill="none"/></svg>` },
          { name: '金文', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M50,15 L50,85 M18,40 Q50,45 82,40 M50,55 L22,85 M50,55 L78,85" stroke="#334155" stroke-width="8" fill="none"/></svg>` },
          { name: '小篆', type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M50,15 L50,55 M15,40 Q50,28 85,40 M50,55 Q28,72 20,88 M50,55 Q72,72 80,88" stroke="#334155" stroke-width="7" fill="none"/></svg>` },
          { name: '楷书', type: 'text', content: '大' }
        ]
      }
    };

    // 2. 词汇多义项释义 + 语法句型用法库 (含各语种地道表达)
    const PHRASE_USAGE_DB = {
      '车马': {
        usage: {
          de: '【Nomen / HSK 3】Bezieht sich auf Fahrzeuge und Pferde / Verkehrsmittel im alten China. Struktur: 车 (Wagen) + 马 (Pferd).',
          en: '【Noun / HSK 3】Refers to carriages and horses / ancient transportation vehicles. Structure: 车 (carriage) + 马 (horse).',
          es: '【Sustantivo / HSK 3】Carruajes y caballos / vehículos de transporte antiguos. Estructura: 车 (carro) + 马 (caballo).',
          fr: '【Nom / HSK 3】Voitures et chevaux / véhicules de transport antiques. Structure: 车 + 马.',
          it: '【Sostantivo / HSK 3】Carri e cavalli / mezzi di trasporto antichi. Struttura: 车 + 马.',
          pt: '【Substantivo / HSK 3】Carruagens e cavalos / veículos antigos. Estrutura: 车 + 马.',
          ru: '【Сущ. / HSK 3】Повозки и кони / старинные экипажи. Структура: 车 + 马.'
        },
        meaning: {
          de: '1. Kutschen und Pferde  2. Fuhrwerk / Verkehrsmittel (antik)',
          en: '1. carriages and horses  2. ancient vehicles / traffic',
          es: '1. carruajes y caballos  2. vehículos y transporte antiguo',
          fr: '1. voitures et chevaux  2. circulation / transports d’autrefois',
          it: '1. carri e cavalli  2. veicoli antichi',
          pt: '1. carruagens e cavalos  2. transporte antigo',
          ru: '1. повозки и кони  2. старинный транспорт'
        }
      },
      '太大了': {
        usage: {
          de: '【Grammatik: 太 + Adj + 了 / HSK 1】Drückt ein übermäßiges Ausmaß aus (zu / extrem + Adjektiv).',
          en: '【Pattern: 太 + Adj + 了 / HSK 1】Expresses an excessive or exclamatory degree (too / extremely + Adj).',
          es: '【Estructura: 太 + Adj + 了 / HSK 1】Indica un grado excesivo o superlativo (demasiado + Adj).',
          fr: '【Structure: 太 + Adj + 了 / HSK 1】Exprime un degré excessif ou exclamatif (trop + Adj).',
          it: '【Struttura: 太 + Adj + 了 / HSK 1】Indica un grado eccessivo (troppo + Agg).',
          pt: '【Estrutura: 太 + Adj + 了 / HSK 1】Indica excesso ou intensidade (demais / muito + Adj).',
          ru: '【Конструкция: 太 + Прил. + 了 / HSK 1】Указывает на чрезмерную степень (слишком + Прил.).'
        },
        meaning: {
          de: '1. viel zu groß / übermäßig groß  2. übergroß',
          en: '1. too big / extremely large  2. oversized',
          es: '1. demasiado grande / enorme  2. de tamaño excesivo',
          fr: '1. trop grand / démesuré  2. surdimensionné',
          it: '1. troppo grande  2. enorme',
          pt: '1. grande demais  2. desmedido',
          ru: '1. слишком большой  2. чересчур крупный'
        }
      },
      '中国银行': {
        usage: {
          de: '【Eigenname / HSK 2】Name einer der vier großen staatlichen Geschäftsbanken Chinas (Bank of China).',
          en: '【Proper Noun / HSK 2】Bank of China (BOC), one of the major state-owned commercial banks.',
          es: '【Nombre propio / HSK 2】Banco de China, uno de los cuatro mayores bancos comerciales de China.',
          fr: '【Nom propre / HSK 2】Banque de Chine (l’une des plus grandes banques d’État).',
          it: '【Nome proprio / HSK 2】Banca di Cina (uno dei principali istituti bancari).',
          pt: '【Nome próprio / HSK 2】Banco da China (uma das maiores instituições financeiras).',
          ru: '【Собств. / HSK 2】Банк Китая (один из крупнейших госбанков КНР).'
        },
        meaning: {
          de: '1. Bank of China  2. Chinesische Staatsbank',
          en: '1. Bank of China (BOC)',
          es: '1. Banco de China',
          fr: '1. Banque de Chine (Bank of China)',
          it: '1. Banca di Cina',
          pt: '1. Banco da China',
          ru: '1. Банк Китая'
        }
      }
    };

    // 3. 多音字语境识别（整词上下文提取）
    function getContextualPinyinList(phrase) {
      return pinyin(phrase, { toneType: 'symbol', type: 'array' });
    }

    // 4. Web Speech API 原生语音合成
    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        alert('当前浏览器暂不支持语音朗读功能');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.85;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // 5. 通用在线多义项翻译与语法用法联机网关
    async function getUniversalPhraseDetails(phrase, targetLang) {
      if (targetLang === 'none' || !phrase) {
        return { meaning: '', usage: '' };
      }

      // 1. 本地精准匹配
      if (PHRASE_USAGE_DB[phrase]) {
        const m = PHRASE_USAGE_DB[phrase].meaning[targetLang] || PHRASE_USAGE_DB[phrase].meaning['en'];
        const u = PHRASE_USAGE_DB[phrase].usage[targetLang] || PHRASE_USAGE_DB[phrase].usage['en'];
        return { meaning: m, usage: u };
      }

      // 2. 在线联机聚合翻译与用法推断
      let meaningResult = '释义获取中...';
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(phrase)}&langpair=zh-CN|${targetLang}`;
        const res = await fetch(url);
        const data = await res.json();
        
        const candidateSet = new Set();
        if (data?.responseData?.translatedText) {
          const mainTrans = data.responseData.translatedText.trim();
          if (!mainTrans.startsWith('MYMEMORY WARNING') && !mainTrans.includes('QUERY LENGTH LIMIT')) {
            candidateSet.add(mainTrans.toLowerCase());
          }
        }
        if (Array.isArray(data?.matches)) {
          data.matches.forEach(m => {
            if (m.translation && m.quality > 40) {
              const clean = m.translation.trim().toLowerCase();
              if (!clean.includes('http') && clean !== phrase.toLowerCase() && clean.length < 40) {
                candidateSet.add(clean);
              }
            }
          });
        }
        const candidates = Array.from(candidateSet).slice(0, 3);
        if (candidates.length > 0) {
          meaningResult = candidates.map((c, i) => `${i + 1}. ${c}`).join('   ');
        }
      } catch (e) {
        meaningResult = '点击补充词语释义';
      }

      // 动态生成对应语言的句法用法提示
      const usageTips = {
        de: `【Wortverwendung】Häufiger chinesischer Begriff/Ausdruck. Bitte im Satzkontext anwenden.`,
        en: `【Usage & Pattern】Common Chinese phrase/expression. Apply according to context.`,
        es: `【Uso gramatical】Frase o expresión común en chino. Usar según el contexto.`,
        fr: `【Usage grammatical】Terme ou expression courante en chinois. À employer selon le contexte.`,
        it: `【Uso grammaticale】Espressione comune cinese. Da usare secondo il contesto.`,
        pt: `【Uso gramatical】Expressão comum em chinês. Usar conforme o contexto.`,
        ru: `【Грамматика и употребление】Употребительное словосочетание/фраза.`
      };

      return {
        meaning: meaningResult,
        usage: usageTips[targetLang] || usageTips['en']
      };
    }

    // 6. 字源网 (hanziyuan.net) 标准节点渲染
    function getHanziYuanData(char) {
      if (ETYMOLOGY_HANZIYUAN_DB[char]) {
        return ETYMOLOGY_HANZIYUAN_DB[char];
      }
      // 通用回退：字源网字体流变标准四阶段
      return {
        icon: `<svg viewBox="0 0 64 64"><rect x="6" y="6" width="52" height="52" rx="8" fill="#1890ff" fill-opacity="0.1"/><text x="32" y="40" font-size="24" font-weight="bold" fill="#1890ff" text-anchor="middle">${char}</text></svg>`,
        nodes: [
          { name: '甲骨', type: 'text', content: char },
          { name: '金文', type: 'text', content: char },
          { name: '小篆', type: 'text', content: char },
          { name: '楷书', type: 'text', content: char }
        ]
      };
    }

    // 7. 生成字帖核心函数
    async function generateSheet() {
      const container = document.getElementById('sheetContainer');
      const text = document.getElementById('textInput').value.trim();
      const targetLang = document.getElementById('langSelect').value;
      container.innerHTML = '';

      const phrases = text.split(/[,，;；\n\s]+/).filter(item => item.trim().length > 0);
      if (phrases.length === 0) {
        alert('请输入有效的中文词语或句子！');
        return;
      }

      let globalGridIdx = 0;

      for (let pIdx = 0; pIdx < phrases.length; pIdx++) {
        const rawPhrase = phrases[pIdx];
        const chars = (rawPhrase.match(/[\u4e00-\u9fa5]/g) || []).join('');
        if (!chars) continue;

        // 多音字整词语境注音
        const contextualPinyins = getContextualPinyinList(chars);
        const phrasePinyinStr = contextualPinyins.join(' ');
        
        const transMeaningId = `trans-meaning-${pIdx}`;
        const transUsageId = `trans-usage-${pIdx}`;

        const wordBlock = document.createElement('div');
        wordBlock.className = 'word-block';

        // 词条顶部头部：左侧拼音与语音 + 右侧条框集中呈现释义与语法用法
        wordBlock.innerHTML = `
          <div class="word-header">
            <div class="word-meta-left">
              <div class="word-text-line">
                <span class="word-text">${chars}</span>
                <button class="btn-audio" onclick="speakText('${chars}')">🔊 朗读</button>
              </div>
              <div class="word-pinyin">[ ${phrasePinyinStr} ]</div>
            </div>
            <div class="word-trans-box" contenteditable="true" title="点击可直接编辑修改词语释义与用法">
              <div class="trans-meaning-line" id="${transMeaningId}">${targetLang === 'none' ? '' : '词语多义项加载中...'}</div>
              <div class="trans-usage-line" id="${transUsageId}">${targetLang === 'none' ? '' : '用法结构分析中...'}</div>
            </div>
          </div>
        `;

        // 逐字生成纯净字卡（去掉了单字释义与单字用法，保留字源网演变与描红）
        for (let cIdx = 0; cIdx < chars.length; cIdx++) {
          const char = chars[cIdx];
          // 确保单字拿到在当前词组上下文中的精准读音（多音字正确）
          const charPy = contextualPinyins[cIdx] || pinyin(char, { toneType: 'symbol' });
          const firstGridId = `grid-demo-${globalGridIdx}`;

          const hyData = getHanziYuanData(char);

          // 演变节点：带字源网（hanziyuan.net）链接
          const evoHtml = hyData.nodes.map((node, idx) => `
            <a class="evo-node" href="https://hanziyuan.net/#${encodeURIComponent(char)}" target="_blank" title="在字源网 (hanziyuan.net) 查看「${char}」的${node.name}原图考据">
              <div class="evo-glyph">
                ${node.type === 'svg' ? node.content : `<span class="evo-glyph-text">${node.content}</span>`}
              </div>
              <div class="evo-label">${node.name}</div>
            </a>
            ${idx < hyData.nodes.length - 1 ? '<span class="evo-arrow">→</span>' : ''}
          `).join('');

          const card = document.createElement('div');
          card.className = 'char-card';

          card.innerHTML = `
            <!-- 左侧：图解 + 字源网演变轨迹 -->
            <div class="char-left-zone">
              <div class="pic-badge" title="${char} 的专属图解">${hyData.icon}</div>
              <div class="etymology-box" title="点击任一阶段可在字源网查看原图考据">${evoHtml}</div>
            </div>

            <!-- 中间：单字多音字读音 + 笔顺演示 + 朗读 -->
            <div class="char-badge">
              <div class="char-pinyin-small">${charPy}</div>
              <div class="btn-action-group">
                <button class="btn-small-audio" onclick="speakText('${char}')" title="朗读此字">🔊</button>
                <button class="btn-animate" onclick="playStroke('${firstGridId}', '${char}')" title="播放笔顺">▶ 笔顺</button>
              </div>
            </div>

            <!-- 右侧：米字格描红练习 -->
            <div class="grid-list" id="grid-list-${globalGridIdx}"></div>
          `;

          // 插入米字格
          const gridList = card.querySelector(`#grid-list-${globalGridIdx}`);
          const totalGrids = 7;
          const currentGrids = [];
          for (let g = 0; g < totalGrids; g++) {
            const grid = document.createElement('div');
            grid.className = 'mi-grid';
            grid.id = (g === 0) ? firstGridId : `grid-${globalGridIdx}-${g}`;
            gridList.appendChild(grid);
            currentGrids.push(grid.id);
          }

          wordBlock.appendChild(card);
          container.appendChild(wordBlock);

          // 渲染黑字示范
          HanziWriter.create(firstGridId, char, {
            width: 42, height: 42, padding: 3, strokeColor: '#000000', showOutline: false
          });

          // 渲染描红浅灰字
          for (let g = 1; g <= 2; g++) {
            HanziWriter.create(currentGrids[g], char, {
              width: 42, height: 42, padding: 3, strokeColor: '#d4d4d4', showOutline: false
            });
          }

          globalGridIdx++;
        }

        // 异步填充整词的多重释义与用法
        if (targetLang !== 'none') {
          getUniversalPhraseDetails(chars, targetLang).then(res => {
            const mEl = document.getElementById(transMeaningId);
            const uEl = document.getElementById(transUsageId);
            if (mEl) mEl.innerText = res.meaning;
            if (uEl) uEl.innerText = res.usage;
          });
        }
      }
    }

    // 播放单字笔顺动画
    function playStroke(elementId, char) {
      const targetElem = document.getElementById(elementId);
      targetElem.innerHTML = '';
      const writer = HanziWriter.create(elementId, char, {
        width: 42, height: 42, padding: 3,
        strokeColor: '#1890ff',
        strokeAnimationSpeed: 1.2,
        delayBetweenStrokes: 120
      });
      writer.animateCharacter();
    }

    window.onload = generateSheet;
  </script>
</body>
</html>
