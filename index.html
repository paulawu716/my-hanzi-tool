<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通用多语言汉字多音字精校与语音字帖系统</title>
  <!-- 引入汉字笔顺库与拼音库 -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.3/dist/index.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
    }

    /* 顶部控制栏 */
    .controls {
      background: #fff;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 1040px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .controls input {
      flex: 3;
      min-width: 280px;
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
    }
    .controls select {
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      background: #fff;
    }
    .btn {
      padding: 9px 18px;
      font-size: 15px;
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-print { background: #52c41a; }
    .btn:hover { opacity: 0.9; }

    /* A4 打印纸张排版 */
    .sheet-page {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 12mm 15mm;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    /* 词组/短语/句子卡片 */
    .word-block {
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 2px dashed #eaeaea;
    }

    /* 词条头部：拼音 + 发音提示 + 目标语言翻译 */
    .word-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      background: #f8fafc;
      padding: 8px 14px;
      border-radius: 6px;
      border-left: 4px solid #1890ff;
    }
    .word-text {
      font-size: 19px;
      font-weight: bold;
      color: #1e293b;
    }
    .word-pinyin {
      font-size: 15px;
      color: #1890ff;
      font-weight: bold;
    }
    .btn-audio {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      color: #096dd9;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .btn-audio:hover {
      background: #bae7ff;
    }
    .word-trans {
      font-size: 13.5px;
      color: #475569;
      background: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px dashed #cbd5e1;
      cursor: text;
      flex: 1;
    }
    .word-trans:focus {
      outline: 1px solid #1890ff;
      background: #f0fdf4;
    }

    /* 单字知识卡片 */
    .char-card {
      margin-bottom: 14px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
    }

    /* 第一行：配图 + 字源演变(甲金篆楷) + 语法解析 */
    .char-info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 6px;
      padding: 8px 10px;
    }

    /* 具象/象形插图 */
    .pic-badge {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .pic-badge svg {
      width: 44px;
      height: 44px;
    }

    /* 汉字演变轨迹 */
    .etymology-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border-right: 1px solid #e2e8f0;
      border-left: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .evo-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 32px;
    }
    .evo-glyph {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .evo-glyph svg {
      width: 24px;
      height: 24px;
      fill: #334155;
    }
    .evo-glyph-text {
      font-size: 15px;
      font-family: "KaiTi", "STKaiti", serif;
      color: #334155;
    }
    .evo-label {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
      transform: scale(0.9);
    }
    .evo-arrow {
      color: #cbd5e1;
      font-size: 11px;
    }

    /* 语法与词性结构区 */
    .grammar-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .grammar-header-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hsk-badge {
      background: #ff4d4f;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .pos-badge {
      background: #8b5cf6;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 3px;
    }
    .grammar-pattern-tag {
      background: #e0f2fe;
      color: #0369a1;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: bold;
    }
    .grammar-meaning-target {
      font-size: 11.5px;
      color: #334155;
      line-height: 1.35;
    }

    /* 第二行：单字读音 + 笔顺 + 米字格描红 */
    .char-practice-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .char-badge {
      width: 60px;
      text-align: center;
      font-size: 14px;
      color: #1e293b;
      font-weight: bold;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .char-pinyin-small {
      color: #1890ff;
      font-size: 13px;
    }
    .btn-action-group {
      display: flex;
      gap: 3px;
    }
    .btn-small-audio {
      padding: 2px 4px;
      font-size: 10px;
      background: #52c41a;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-animate {
      padding: 2px 4px;
      font-size: 10px;
      background: #fa8c16;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    /* 米字格布局 */
    .grid-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mi-grid {
      width: 42px;
      height: 42px;
      border: 1px solid #ff4d4f;
      position: relative;
      background:
        linear-gradient(to top right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px));
      background-size: 100% 100%;
    }

    /* 打印适配 */
    @media print {
      body { background: transparent; padding: 0; }
      .controls { display: none !important; }
      .sheet-page { box-shadow: none; width: 100%; margin: 0; padding: 0; }
      .btn-animate, .btn-audio, .btn-small-audio { display: none !important; }
      .word-trans { border: none; background: transparent; padding: 0; }
      .char-info-row { background: #fff !important; border: 1px solid #cbd5e1; }
      .char-card { border: 1px solid #94a3b8; }
    }
  </style>
</head>
<body>

  <!-- 控制工具栏 -->
  <div class="controls">
    <input type="text" id="textInput" value="中国银行, 去看电影, 睡觉, 觉得太好了" placeholder="输入任意词语或句子（已精准支持多音字语境识别）..." />
    
    <select id="langSelect" onchange="generateSheet()">
      <option value="de">🇩🇪 德语 (Deutsch)</option>
      <option value="en">🇬🇧 英语 (English)</option>
      <option value="es">🇪🇸 西班牙语 (Español)</option>
      <option value="fr">🇫🇷 法语 (Français)</option>
      <option value="it">🇮🇹 意大利语 (Italiano)</option>
      <option value="pt">🇵🇹 葡萄牙语 (Português)</option>
      <option value="ru">🇷🇺 俄语 (Русский)</option>
      <option value="none">🚫 无翻译</option>
    </select>

    <button class="btn" onclick="generateSheet()">生成字帖</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 打印字帖</button>
  </div>

  <div class="sheet-page" id="sheetContainer"></div>

  <script>
    const { pinyin } = pinyinPro;

    // 1. 各语种词性国际标准对照表
    const POS_I18N = {
      noun: { de: 'Nomen (名词)', en: 'Noun (名词)', es: 'Sustantivo (名词)', fr: 'Nom (名词)', it: 'Sostantivo (名词)', pt: 'Substantivo (名词)', ru: 'Существительное (名词)' },
      verb: { de: 'Verb (动词)', en: 'Verb (动词)', es: 'Verbo (动词)', fr: 'Verbe (动词)', it: 'Verbo (动词)', pt: 'Verbo (动词)', ru: 'Глагол (动词)' },
      adj:  { de: 'Adjektiv (形容词)', en: 'Adjective (形容词)', es: 'Adjetivo (形容词)', fr: 'Adjectif (形容词)', it: 'Aggettivo (形容词)', pt: 'Adjetivo (形容词)', ru: 'Прилагательное (形容词)' },
      adv:  { de: 'Adverb (副词)', en: 'Adverb (副词)', es: 'Adverbio (副词)', fr: 'Adverbe (副词)', it: 'Avverbio (副词)', pt: 'Advérbio (副词)', ru: 'Наречие (副词)' },
      pron: { de: 'Pronomen (代词)', en: 'Pronoun (代词)', es: 'Pronombre (代词)', fr: 'Pronom (代词)', it: 'Pronome (代词)', pt: 'Pronome (代词)', ru: 'Местоимение (代词)' },
      num:  { de: 'Zahlwort (数词/量词)', en: 'Numeral/Measure Word', es: 'Numeral / Clasificador', fr: 'Numéral / Classificateur', it: 'Numerale / Classificatore', pt: 'Numeral / Classificador', ru: 'Числительное / Счетное сл.' },
      prep: { de: 'Präposition (介词)', en: 'Preposition (介词)', es: 'Preposición (介词)', fr: 'Préposition (介词)', it: 'Preposizione (介词)', pt: 'Preposizione (介词)', ru: 'Предлог (介词)' }
    };

    // 2. 核心：基于语境的多音字精准解析算法 (Context-Aware Polyphonic Pipeline)
    function getContextualPinyinList(phrase) {
      // 在整词/整句语境下统一计算拼音数组，确保多音字在上下文中的读音完全准确
      const pinyinArray = pinyin(phrase, { toneType: 'symbol', type: 'array' });
      return pinyinArray;
    }

    // 3. Web Speech API 原生高保真语音朗读提示
    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        alert('当前浏览器暂不支持语音合成朗读功能');
        return;
      }
      window.speechSynthesis.cancel(); // 停止当前正在播放的声音
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.85; // 稍慢语速，适合对外汉语跟读
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // 4. 动态语法与词性规则引擎
    function inferGrammarAndPOS(char, targetLang) {
      const code = char.charCodeAt(0);
      let posKey = 'noun';
      let patternZh = `${char} + 名词 / 结构`;
      let hsk = 'HSK 1';

      if ('太很非常真最更挺特别极其'.includes(char)) {
        posKey = 'adv';
        patternZh = `${char} + 形容词 / 动词 + (了)`;
        hsk = 'HSK 1';
      } else if ('看吃喝走去来想爱做买写听读说说见找问笑学住工作睡觉行'.includes(char)) {
        posKey = 'verb';
        patternZh = `${char} + 宾语 (Objekt) / 补语`;
        hsk = 'HSK 1';
      } else if ('大小高低好坏多少红黑白长短早晚美快慢'.includes(char)) {
        posKey = 'adj';
        patternZh = `很 / 太 + ${char} (作谓语/修饰语)`;
        hsk = 'HSK 1';
      } else if ('你我他她它这那谁什么哪'.includes(char)) {
        posKey = 'pron';
        patternZh = `${char} + (的) + 名词`;
        hsk = 'HSK 1';
      } else if ('在从向对比被把跟给'.includes(char)) {
        posKey = 'prep';
        patternZh = `${char} + 地点 / 对象 + 动词`;
        hsk = 'HSK 2';
      } else if ('一二三四五六七八九十百千万个张本支只条位块'.includes(char)) {
        posKey = 'num';
        patternZh = `数词 + ${char} + 名词`;
        hsk = 'HSK 1';
      } else {
        posKey = 'noun';
        patternZh = `(这/那) + 量词 + ${char}`;
        hsk = code % 2 === 0 ? 'HSK 2' : 'HSK 3';
      }

      const posName = POS_I18N[posKey][targetLang] || POS_I18N[posKey]['en'];
      return { posKey, posName, patternZh, hsk };
    }

    // 5. 通用多语言翻译网关
    async function universalTranslate(text, targetLang) {
      if (targetLang === 'none' || !text) return '';
      
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh-CN|${targetLang}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data?.responseData?.translatedText) {
          const trans = data.responseData.translatedText.trim();
          if (!trans.startsWith('MYMEMORY WARNING') && !trans.includes('QUERY LENGTH LIMIT')) {
            return trans;
          }
        }
      } catch (e) {
        console.warn('MyMemory 调度失败:', e);
      }

      try {
        const lingvaUrl = `https://lingva.ml/api/v1/zh/${targetLang}/${encodeURIComponent(text)}`;
        const res2 = await fetch(lingvaUrl);
        const data2 = await res2.json();
        if (data2?.translation) {
          return data2.translation.trim();
        }
      } catch (e2) {
        console.warn('Lingva 调度失败:', e2);
      }

      return '点击补充释义';
    }

    // 6. 字形流变与通用插图
    function getEtymologyNodes(char) {
      return [
        { name: '甲骨', content: char },
        { name: '金文', content: char },
        { name: '小篆', content: char },
        { name: '楷书', content: char }
      ];
    }

    function generateDynamicIcon(char) {
      const colors = ['#1890ff', '#52c41a', '#fa8c16', '#eb2f96', '#722ed1', '#13c2c2', '#faad14'];
      const color = colors[char.charCodeAt(0) % colors.length];
      return `
        <svg viewBox="0 0 64 64">
          <rect x="6" y="6" width="52" height="52" rx="10" fill="${color}" fill-opacity="0.12"/>
          <text x="32" y="40" font-size="26" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="${color}" text-anchor="middle">${char}</text>
        </svg>
      `;
    }

    // 7. 生成字帖核心入口
    async function generateSheet() {
      const container = document.getElementById('sheetContainer');
      const text = document.getElementById('textInput').value.trim();
      const targetLang = document.getElementById('langSelect').value;
      container.innerHTML = '';

      const phrases = text.split(/[,，;；\n\s]+/).filter(item => item.trim().length > 0);
      if (phrases.length === 0) {
        alert('请输入有效的中文词语或句子！');
        return;
      }

      let globalGridIdx = 0;

      for (let pIdx = 0; pIdx < phrases.length; pIdx++) {
        const rawPhrase = phrases[pIdx];
        const chars = (rawPhrase.match(/[\u4e00-\u9fa5]/g) || []).join('');
        if (!chars) continue;

        // 【多音字核心】：整句语境提取拼音列表，确保每个字拿到它在当前词里的专属正确发音
        const contextualPinyins = getContextualPinyinList(chars);
        const phrasePinyinStr = contextualPinyins.join(' ');
        const transBoxId = `trans-box-${pIdx}`;

        const wordBlock = document.createElement('div');
        wordBlock.className = 'word-block';

        // 词条顶部头部 + 整词语音朗读按钮
        wordBlock.innerHTML = `
          <div class="word-header">
            <span class="word-text">${chars}</span>
            <span class="word-pinyin">[ ${phrasePinyinStr} ]</span>
            <button class="btn-audio" onclick="speakText('${chars}')">🔊 朗读词句</button>
            <div class="word-trans" id="${transBoxId}" contenteditable="true" title="点击可直接编辑修改翻译">${targetLang === 'none' ? '' : '翻译获取中...'}</div>
          </div>
        `;

        // 逐字生成演变图与带有语境多音字读音的字卡
        for (let cIdx = 0; cIdx < chars.length; cIdx++) {
          const char = chars[cIdx];
          // 准确取出语境下的单字拼音（自动解决如银行 háng、行走 xíng 等多音字问题）
          const charPy = contextualPinyins[cIdx] || pinyin(char, { toneType: 'symbol' });
          const firstGridId = `grid-demo-${globalGridIdx}`;
          const grammarMeaningId = `grammar-mean-${pIdx}-${cIdx}`;

          const grammarInfo = inferGrammarAndPOS(char, targetLang);
          const evoNodes = getEtymologyNodes(char);
          const iconSvg = generateDynamicIcon(char);

          const evoHtml = evoNodes.map((node, idx) => `
            <div class="evo-node">
              <div class="evo-glyph">
                <span class="evo-glyph-text">${node.content}</span>
              </div>
              <div class="evo-label">${node.name}</div>
            </div>
            ${idx < evoNodes.length - 1 ? '<span class="evo-arrow">→</span>' : ''}
          `).join('');

          const card = document.createElement('div');
          card.className = 'char-card';

          card.innerHTML = `
            <div class="char-info-row">
              <div class="pic-badge" title="${char} 的字图解">${iconSvg}</div>
              <div class="etymology-box" title="汉字源流演变">${evoHtml}</div>
              <div class="grammar-box">
                <div class="grammar-header-line">
                  <span class="hsk-badge">${grammarInfo.hsk}</span>
                  <span class="pos-badge">${grammarInfo.posName}</span>
                  <span class="grammar-pattern-tag">${grammarInfo.patternZh}</span>
                </div>
                <div class="grammar-meaning-target" id="${grammarMeaningId}">释义生成中...</div>
              </div>
            </div>
          `;

          // 笔顺演示、单字读音与米字格描红
          const practiceRow = document.createElement('div');
          practiceRow.className = 'char-practice-row';

          const charBadge = document.createElement('div');
          charBadge.className = 'char-badge';
          charBadge.innerHTML = `
            <div class="char-pinyin-small">${charPy}</div>
            <div class="btn-action-group">
              <button class="btn-small-audio" onclick="speakText('${char}')" title="朗读该字">🔊</button>
              <button class="btn-animate" onclick="playStroke('${firstGridId}', '${char}')" title="播放笔顺">▶ 笔顺</button>
            </div>
          `;
          practiceRow.appendChild(charBadge);

          // 米字格（1示范 + 2描红 + 4练习）
          const gridList = document.createElement('div');
          gridList.className = 'grid-list';
          
          const totalGrids = 7;
          const currentGrids = [];
          for (let g = 0; g < totalGrids; g++) {
            const grid = document.createElement('div');
            grid.className = 'mi-grid';
            grid.id = (g === 0) ? firstGridId : `grid-${globalGridIdx}-${g}`;
            gridList.appendChild(grid);
            currentGrids.push(grid.id);
          }
          practiceRow.appendChild(gridList);
          card.appendChild(practiceRow);

          wordBlock.appendChild(card);
          container.appendChild(wordBlock);

          // 渲染黑字示范
          HanziWriter.create(firstGridId, char, {
            width: 42, height: 42, padding: 3, strokeColor: '#000000', showOutline: false
          });

          // 渲染描红浅灰字
          for (let g = 1; g <= 2; g++) {
            HanziWriter.create(currentGrids[g], char, {
              width: 42, height: 42, padding: 3, strokeColor: '#d4d4d4', showOutline: false
            });
          }

          // 异步动态翻译单字的含义
          if (targetLang !== 'none') {
            universalTranslate(char, targetLang).then(res => {
              const el = document.getElementById(grammarMeaningId);
              if (el) el.innerText = `语义释义: ${res}`;
            });
          }

          globalGridIdx++;
        }

        // 异步获取整词/整句地道翻译
        if (targetLang !== 'none') {
          universalTranslate(chars, targetLang).then(res => {
            const transEl = document.getElementById(transBoxId);
            if (transEl) transEl.innerText = res;
          });
        }
      }
    }

    // 播放单字笔顺动画
    function playStroke(elementId, char) {
      const targetElem = document.getElementById(elementId);
      targetElem.innerHTML = '';
      const writer = HanziWriter.create(elementId, char, {
        width: 42, height: 42, padding: 3,
        strokeColor: '#1890ff',
        strokeAnimationSpeed: 1.2,
        delayBetweenStrokes: 120
      });
      writer.animateCharacter();
    }

    window.onload = generateSheet;
  </script>
</body>
</html>
