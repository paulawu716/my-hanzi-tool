<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多语言汉字演变与语法笔顺描红字帖</title>
  <!-- 引入汉字笔顺库与拼音库 -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.3/dist/index.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
    }

    /* 顶部控制栏 */
    .controls {
      background: #fff;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 980px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .controls input {
      flex: 3;
      min-width: 260px;
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
    }
    .controls select {
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      background: #fff;
    }
    .btn {
      padding: 8px 18px;
      font-size: 15px;
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-print { background: #52c41a; }
    .btn:hover { opacity: 0.9; }

    /* A4 打印纸张容器 */
    .sheet-page {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 12mm 15mm;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    /* 词组/整句单元块 */
    .word-block {
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #eaeaea;
    }

    /* 词条顶部：整词/句型拼音与翻译 */
    .word-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
      padding: 6px 12px;
      border-radius: 6px;
      border-left: 4px solid #1890ff;
    }
    .word-text {
      font-size: 18px;
      font-weight: bold;
      color: #1e293b;
    }
    .word-pinyin {
      font-size: 14px;
      color: #1890ff;
      font-weight: bold;
    }
    .word-trans {
      font-size: 13px;
      color: #475569;
      background: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px dashed #cbd5e1;
      cursor: text;
      flex: 1;
    }
    .word-trans:focus {
      outline: 1px solid #1890ff;
      background: #f0fdf4;
    }

    /* 单字卡片 */
    .char-card {
      margin-bottom: 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
    }

    /* 第一行：图片 + 字源演变(hanziyuan标准) + 语法结构 */
    .char-info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 6px;
      padding: 8px 10px;
    }

    /* 精准配图 */
    .pic-badge {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .pic-badge svg {
      width: 44px;
      height: 44px;
    }

    /* 汉字字源演变区 (甲骨文 -> 金文 -> 小篆 -> 楷书) */
    .etymology-box {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border-right: 1px solid #e2e8f0;
      border-left: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .evo-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 32px;
    }
    .evo-glyph {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .evo-glyph svg {
      width: 24px;
      height: 24px;
      fill: #334155;
    }
    .evo-glyph-text {
      font-size: 15px;
      font-family: "KaiTi", "STKaiti", serif;
      color: #334155;
    }
    .evo-label {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
      transform: scale(0.9);
    }
    .evo-arrow {
      color: #cbd5e1;
      font-size: 11px;
    }

    /* 语法与句型结构区 */
    .grammar-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .grammar-pattern-tag {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 1px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      width: fit-content;
      margin-bottom: 2px;
    }
    .grammar-meaning {
      font-size: 11.5px;
      color: #334155;
      line-height: 1.35;
    }

    /* 第二行：笔顺与米字格描红 */
    .char-practice-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .char-badge {
      width: 48px;
      text-align: center;
      font-size: 14px;
      color: #1e293b;
      font-weight: bold;
      flex-shrink: 0;
    }
    .char-pinyin-small {
      color: #1890ff;
      font-size: 13px;
    }
    .btn-animate {
      padding: 2px 6px;
      font-size: 10px;
      background: #fa8c16;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin-top: 3px;
    }

    /* 米字格布局 */
    .grid-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mi-grid {
      width: 42px;
      height: 42px;
      border: 1px solid #ff4d4f;
      position: relative;
      background:
        linear-gradient(to top right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to right, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), #ffa39e 50%, transparent calc(50% + 0.5px));
      background-size: 100% 100%;
    }

    /* 打印适配 */
    @media print {
      body { background: transparent; padding: 0; }
      .controls { display: none !important; }
      .sheet-page { box-shadow: none; width: 100%; margin: 0; padding: 0; }
      .btn-animate { display: none; }
      .word-trans { border: none; background: transparent; padding: 0; }
      .char-info-row { background: #fff !important; border: 1px solid #cbd5e1; }
      .char-card { border: 1px solid #94a3b8; }
    }
  </style>
</head>
<body>

  <!-- 控制工具栏 -->
  <div class="controls">
    <input type="text" id="textInput" value="太大了, 太阳, 高山, 森林" placeholder="输入词语、短语或句型，用逗号或空格隔开..." />
    
    <select id="langSelect">
      <option value="es">🇪🇸 西班牙语 (Español)</option>
      <option value="en">🇬🇧 英语 (English)</option>
      <option value="de">🇩🇪 德语 (Deutsch)</option>
      <option value="fr">🇫🇷 法语 (Français)</option>
      <option value="it">🇮🇹 意大利语 (Italiano)</option>
      <option value="pt">🇵🇹 葡萄牙语 (Português)</option>
      <option value="ru">🇷🇺 俄语 (Русский)</option>
      <option value="none">🚫 无翻译</option>
    </select>

    <button class="btn" onclick="generateSheet()">生成字帖</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 打印字帖</button>
  </div>

  <div class="sheet-page" id="sheetContainer"></div>

  <script>

    // 2. 严格校对的多语言整词/短语地道释义词典 (避免西班牙语等混入英语)

      '太大了': { 
        es: 'Demasiado grande', 
        en: 'Too big / Extremely large', 
        de: 'Viel zu groß', 
        fr: 'Trop grand', 
        it: 'Troppo grande', 
        pt: 'Grande demais', 
        ru: 'Слишком большой' 
      },
      '太阳': { 
        es: 'El sol', 
        en: 'The Sun', 
        de: 'Die Sonne', 
        fr: 'Le soleil', 
        it: 'Il sole', 
        pt: 'O sol', 
        ru: 'Солнце' 
      },
      '月亮': { 
        es: 'La luna', 
        en: 'The Moon', 
        de: 'Der Mond', 
        fr: 'La lune', 
        it: 'La luna', 
        pt: 'A lua', 
        ru: 'Луна' 
      },
      '高山': { 
        es: 'Montaña alta', 
        en: 'High mountain', 
        de: 'Hoher Berg', 
        fr: 'Haute montagne', 
        it: 'Alta montagna',

        es: 'Bosque / Selva', 
        en: 'Forest',

        it: 'La foresta', 
        pt: 'A floresta', 
        ru: 'Лес' 
      }
    };

    // 在线翻译与准确性验证
    async function getPhraseTranslation(phrase, targetLang) {
      if (targetLang === 'none') return '';
      
      // 优先从校对词典获取
      if (PHRASE_DICT[phrase] && PHRASE_DICT[phrase][targetLang]) {
        return PHRASE_DICT[phrase][targetLang];
      }

      // 在线翻译
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(phrase)}&langpair=zh-CN|${targetLang}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data?.responseData?.translatedText) {
          const trans = data.responseData.translatedText.trim();
          if (!trans.startsWith('MYMEMORY WARNING') && !trans.includes('QUERY LENGTH LIMIT')) {
            return trans;
          }
        }
      } catch (e) {
        console.warn('在线翻译异常:', e);
      }

      return '点击补充翻译';
    }

    async function generateSheet() {
      const container = document.getElementById('sheetContainer');
      const text = document.getElementById('textInput').value.trim();
      const targetLang = document.getElementById('langSelect').value;
      container.innerHTML = '';

      const phrases = text.split(/[,，;；\n\s]+/).filter(item => item.trim().length > 0);
      if (phrases.length === 0) {
        alert('请输入有效的中文词语或句子！');
        return;
      }

      let globalGridIdx = 0;

      for (let pIdx = 0; pIdx < phrases.length; pIdx++) {
        const rawPhrase = phrases[pIdx];
        const chars = (rawPhrase.match(/[\u4e00-\u9fa5]/g) || []).join('');
        if (!chars) continue;

        const phrasePinyin = pinyin(chars, { toneType: 'symbol' });
        const transBoxId = `trans-box-${pIdx}`;

        const wordBlock = document.createElement('div');
        wordBlock.className = 'word-block';

        // 词条顶部头部
        wordBlock.innerHTML = `
          <div class="word-header">
            <span class="word-text">${chars}</span>
            <span class="word-pinyin">[ ${phrasePinyin} ]</span>
            <div class="word-trans" id="${transBoxId}" contenteditable="true" title="点击可编辑释义">${targetLang === 'none' ? '' : '翻译获取中...'}</div>
          </div>
        `;

        // 逐字生成演变图与语法描红卡片
        for (let cIdx = 0; cIdx < chars.length; cIdx++) {
          const char = chars[cIdx];
          const charPy = pinyin(char, { toneType: 'symbol' });
          const firstGridId = `grid-demo-${globalGridIdx}`;

          const charData = CHAR_DATA_DB[char];
          const card = document.createElement('div');
          card.className = 'char-card';

          if (charData) {
            // 演变轨迹节点生成
            const evoHtml = charData.etymology.map((node, idx) => `
              <div class="evo-node">
                <div class="evo-glyph">
                  ${node.type === 'svg' ? node.content : `<span class="evo-glyph-text">${node.content}</span>`}
                </div>
                <div class="evo-label">${node.name}</div>
              </div>
              ${idx < charData.etymology.length - 1 ? '<span class="evo-arrow">→</span>' : ''}
            `).join('');

            // 语法说明根据选择语言适配，默认回退英语
            const grammarDesc = (targetLang !== 'none' && charData.grammar.meaning[targetLang]) 
              ? charData.grammar.meaning[targetLang] 
              : (charData.grammar.meaning['en'] || Object.values(charData.grammar.meaning)[0]);

            card.innerHTML = `
              <div class="char-info-row">
                <div class="pic-badge" title="${char} 的专属配图">${charData.icon}</div>
                <div class="etymology-box" title="汉字源流演变 (字源网标准)">${evoHtml}</div>
                <div class="grammar-box">
                  <div class="grammar-pattern-tag">${charData.grammar.pattern}</div>
                  <div class="grammar-meaning">${grammarDesc}</div>
                </div>
              </div>
            `;
          }

          // 笔顺演示与描红米字格
          const practiceRow = document.createElement('div');
          practiceRow.className = 'char-practice-row';

          const charBadge = document.createElement('div');
          charBadge.className = 'char-badge';
          charBadge.innerHTML = `
            <div class="char-pinyin-small">${charPy}</div>
            <button class="btn-animate" onclick="playStroke('${firstGridId}', '${char}')">▶ 笔顺</button>
          `;
          practiceRow.appendChild(charBadge);

          // 米字格（1示范黑字 + 2描红灰字 + 4空白练习格）
          const gridList = document.createElement('div');
          gridList.className = 'grid-list';
          
          const totalGrids = 7;
          const currentGrids = [];
          for (let g = 0; g < totalGrids; g++) {
            const grid = document.createElement('div');
            grid.className = 'mi-grid';
            grid.id = (g === 0) ? firstGridId : `grid-${globalGridIdx}-${g}`;
            gridList.appendChild(grid);
            currentGrids.push(grid.id);
          }
          practiceRow.appendChild(gridList);
          card.appendChild(practiceRow);

          wordBlock.appendChild(card);
          container.appendChild(wordBlock);

          // 渲染黑字示范
          HanziWriter.create(firstGridId, char, {
            width: 42, height: 42, padding: 3, strokeColor: '#000000', showOutline: false
          });

          // 渲染描红浅灰字
          for (let g = 1; g <= 2; g++) {
            HanziWriter.create(currentGrids[g], char, {
              width: 42, height: 42, padding: 3, strokeColor: '#d4d4d4', showOutline: false
            });
          }

          globalGridIdx++;
        }

        // 异步填充整词地道翻译
        if (targetLang !== 'none') {
          getPhraseTranslation(chars, targetLang).then(res => {
            const transEl = document.getElementById(transBoxId);
            if (transEl) transEl.innerText = res;
          });
        }
      }
    }

    // 播放单字笔顺动画
    function playStroke(elementId, char) {
      const targetElem = document.getElementById(elementId);
      targetElem.innerHTML = '';
      const writer = HanziWriter.create(elementId, char, {
        width: 42, height: 42, padding: 3,
        strokeColor: '#1890ff',
        strokeAnimationSpeed: 1.2,
        delayBetweenStrokes: 120
      });
      writer.animateCharacter();
    }

    window.onload = generateSheet;
  </script>
